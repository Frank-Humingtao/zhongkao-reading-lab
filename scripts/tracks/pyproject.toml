[project]
name = "zhongkao-tracks"
version = "1.0.0"
description = "Kokoro tracks for listening (see generate.py)"
requires-python = "==3.12.*"
dependencies = [
  "kokoro==0.9.4",
  "misaki[en,zh]==0.9.4",
  "en-core-web-sm",
  "numpy",
  "soundfile",
  "imageio-ffmpeg",
  "torch",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
# CPU-only torch on Linux CI; the CUDA build is gigabytes and unused.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
