# Listening tracks: Kokoro voices for every story, published to GitHub Releases.
# See scripts/tracks/generate.py. Never commits to the repository: tracks go to
# the tracks-NNN releases and catalog.json to the tracks-catalog release.
name: Listening tracks

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Only this reading set, news edition or "screening" (empty for every story)
        required: false
        default: ""

permissions:
  contents: write

# One run at a time, so two runs never overwrite each other's catalog.
concurrency:
  group: listening-tracks
  cancel-in-progress: false

jobs:
  tracks:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: scripts/tracks/uv.lock

      - name: Install espeak-ng
        run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng

      - name: Cache the Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Plan
        env:
          EDITION: ${{ inputs.edition }}
        run: node scripts/narration-plan.mjs ${EDITION:+--edition "$EDITION"} > "$RUNNER_TEMP/plan.json"

      - name: Make and publish missing tracks
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --project scripts/tracks python scripts/tracks/generate.py
          --plan "$RUNNER_TEMP/plan.json" --out "$RUNNER_TEMP/tracks"
          --publish --repo "$GITHUB_REPOSITORY"
