<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中考英语阅读标词</title>
  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131518" media="(prefers-color-scheme: dark)">
  <script id="theme-settings">
    const themeStorageKey = "zhongkao-reading-theme";
    const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
    let preferredTheme;
    try {
      preferredTheme = localStorage.getItem(themeStorageKey);
    } catch {
      // The system preference still applies if local storage is unavailable.
    }

    function updateTheme() {
      const dark = preferredTheme === "dark" || (preferredTheme !== "light" && systemTheme.matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      const toggle = document.getElementById("dark-mode");
      if (toggle) {
        toggle.setAttribute("aria-pressed", dark);
        toggle.setAttribute("aria-label", dark ? "切换到浅色" : "切换到深色");
      }
    }

    updateTheme();
  </script>
  <link rel="stylesheet" href="site.css">
  <style>
    .shell {
      max-width: 1120px; margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) var(--gutter) calc(64px + env(safe-area-inset-bottom));
    }

    /* ---------- View bar: 文章 / 词汇表 + 中英 / 目录 ---------- */
    .viewbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 8px;
      margin: 10px calc(-1 * var(--gutter)) 0; padding: 10px var(--gutter);
      background: var(--bg);
    }
    .tabs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--fill); min-width: 0; }
    .tab { padding: 6px 14px; border-radius: 999px; color: var(--ink-2); font-size: .92rem; white-space: nowrap; }
    .tab:hover { color: var(--ink); }
    .tab[aria-expanded="true"],
    .tabs:not(:has([aria-expanded="true"])) #open-reader {
      background: var(--tab-on); color: var(--ink); box-shadow: 0 1px 3px #0000001a;
    }
    .viewbar-end { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 12px; border-radius: 999px; color: var(--ink-2); font-size: .92rem; white-space: nowrap;
    }
    .pill:hover { background: var(--fill); color: var(--ink); }
    .pill[aria-pressed="true"] { background: var(--solid); color: var(--on-solid); }
    .pill .icon { width: 18px; height: 18px; }
    body:has(#reader[hidden]) #toggle-bilingual { display: none; }
    .storage-error { margin-top: 8px; color: var(--accent); font-size: .9rem; }

    /* ---------- Layout ---------- */
    .layout {
      display: grid; grid-template-columns: 220px minmax(0, 1fr);
      align-items: start; gap: clamp(24px, 4vw, 56px); margin-top: 18px;
    }
    .layout.directory-closed { grid-template-columns: minmax(0, 1fr); }
    .navigation { position: sticky; top: 70px; min-width: 0; }
    .directory-closed .navigation { display: none; }
    .directory-entries {
      max-height: calc(100vh - 100px); overflow: auto; display: grid; gap: 1px;
      scrollbar-width: none; overscroll-behavior: contain;
    }
    .directory-entries::-webkit-scrollbar { display: none; }
    .directory-lesson {
      display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 8px 12px;
      border-radius: 10px; text-align: left; font-size: .9rem; color: var(--ink-2);
    }
    .directory-lesson:hover, .directory-lesson[aria-current="page"] { background: var(--fill); color: var(--ink); }
    .directory-number { flex: 0 0 1.6em; color: var(--muted); font-family: var(--english); font-variant-numeric: tabular-nums; }
    .directory-status { margin-left: auto; flex: 0 0 auto; color: var(--ok); }
    .surface { min-width: 0; max-width: 700px; }
    .directory-closed .surface { margin-inline: auto; }

    /* ---------- Article ---------- */
    .reading-head { padding-top: 8px; }
    .reading-title {
      font-family: var(--english); font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.18;
      letter-spacing: -.01em; outline: none;
    }
    .translated-title { margin-top: 8px; color: var(--ink-2); font-size: clamp(1.15rem, 3vw, 1.4rem); }
    .reading-body { margin-top: 26px; }
    .reading-illustration {
      display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover;
      border-radius: 16px; background: var(--fill); margin-bottom: 28px;
    }
    .passage { font: 1.22rem/1.85 var(--english); color: var(--ink); }
    .passage-block + .passage-block { margin-top: 1em; }
    .passage.bilingual .passage-block + .passage-block { margin-top: 1.5em; }
    .translation { display: none; margin-top: .5em; color: var(--ink-2); font: .86em/1.8 var(--chinese); }
    .passage.bilingual .translation { display: block; }
    .passage.bilingual .aligned-sentence.matched { background: var(--fill); border-radius: 4px; }
    .word {
      display: inline; border-radius: 4px; font: inherit; letter-spacing: inherit; line-height: inherit;
      text-align: inherit; -webkit-tap-highlight-color: transparent;
    }
    @media (hover: hover) {
      .word:hover { background: var(--fill); }
    }
    .word[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
    .inline-gloss { color: var(--muted); font: .7em var(--chinese); overflow-wrap: anywhere; margin-left: .15em; }
    .word.located { outline: 2px solid var(--accent); outline-offset: 2px; }

    .reading-foot {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
      margin-top: 44px; padding-top: 20px; box-shadow: inset 0 1px var(--hair);
    }
    .foot-button { min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: .95rem; color: var(--ink-2); }
    .foot-button:hover:not(:disabled) { background: var(--fill); color: var(--ink); }
    #previous { justify-self: start; }
    #finish-lesson { background: var(--fill); color: var(--ink); }
    #finish-lesson:hover { background: var(--fill-hover); }
    #finish-lesson[aria-pressed="true"] { background: none; color: var(--ok); }
    #next { justify-self: end; background: var(--solid); color: var(--on-solid); }
    #next:hover { background: var(--solid); opacity: .9; }

    /* ---------- 词汇表 ---------- */
    #resume-vocabulary { display: none; }
    .empty { padding: 48px 0; text-align: center; color: var(--muted); }
    .feedback { margin-top: 8px; color: var(--ok); font-size: .9rem; }
    .feedback:empty { display: none; }
    .vocab-search {
      width: 100%; margin-top: 14px; padding: 12px 16px; border: 0; border-radius: 12px;
      background: var(--fill); color: var(--ink); font: inherit; font-size: 1rem;
    }
    .vocab-list { margin-top: 18px; }
    .vocab-letter { padding: 18px 0 4px; color: var(--muted); font: 1rem var(--english); }
    .vocab-entry { padding: 7px 0; font-size: .95rem; line-height: 1.65; }
    .vocab-entry p { min-width: 0; overflow-wrap: anywhere; }
    .term-button, .entry-word { text-align: left; color: var(--ink); }
    .term-button:hover, .entry-word:hover { color: var(--accent); }
    .entry-word { font: 1.1rem var(--english); margin-right: .4em; }

    /* ---------- Word menu ---------- */
    .word-menu {
      position: fixed; z-index: 50; width: min(300px, calc(100vw - 16px)); max-height: min(460px, 65vh);
      overflow-y: auto; overscroll-behavior: contain; padding: 6px;
      background: var(--raised); border-radius: 16px; box-shadow: var(--shadow);
    }
    .word-menu-title { padding: 8px 10px 6px; font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
    .word-menu-item { display: block; width: 100%; padding: 9px 10px; border-radius: 10px; text-align: left; font-size: .92rem; }
    .word-menu-item:hover, .word-menu-item:focus, .word-menu-item.speaking { background: var(--fill); }
    .word-menu .feedback { padding: 0 10px 6px; }

    @media (min-width: 1000px) {
      .reading-body::after { content: ""; display: block; clear: both; }
      .reading-illustration { float: right; width: 46%; margin: .45em 0 18px 28px; border-radius: 14px; }
    }

    @media (max-width: 760px) {
      .layout { grid-template-columns: minmax(0, 1fr); gap: 0; margin-top: 0; }
      .navigation { position: static; margin: 4px 0 18px; }
      .directory-entries { max-height: min(46vh, 360px); padding: 6px; border-radius: 16px; background: var(--raised); }
      .directory-lesson { min-height: 40px; align-items: center; }
      .tab { padding: 6px 12px; }
      .pill .pill-text { display: none; }
      .pill { padding: 8px; }
      .reading-body { margin-top: 20px; }
      .reading-illustration {
        margin-inline: calc(-1 * var(--gutter)); width: calc(100% + 2 * var(--gutter)); max-width: none;
        border-radius: 0; margin-bottom: 22px;
      }
      .passage { font-size: 1.16rem; line-height: 1.8; }
      .reading-foot { margin-top: 36px; }
      .foot-button { padding: 0 12px; }
    }
  </style>
  <script src="site-nav.js" defer></script>
</head>

        <div class="directory-entries" id="directory-panel" aria-label="短文篇目"></div>
      </nav>
      <div class="surface">
        <article id="reader" aria-labelledby="reading-title">
          <header class="reading-head">
            <h2 class="reading-title" id="reading-title" lang="en" tabindex="-1"></h2>

          </header>
          <div class="reading-body">
            <img class="reading-illustration" id="reading-illustration" width="960" height="640" alt="" decoding="async" hidden>

          <footer class="reading-foot">

            <button type="button" class="foot-button" id="finish-lesson" aria-pressed="false">标为已读</button>
            <button type="button" class="foot-button" id="next"></button>
          </footer>
        </article>
        <section id="full-vocabulary" aria-labelledby="full-vocabulary-title" hidden>
          <h2 class="visually-hidden" id="full-vocabulary-title" tabindex="-1">完整词汇表</h2>
          <input class="vocab-search" type="search" id="vocab-search" aria-label="搜索词汇" placeholder="搜索">
          <button type="button" id="resume-vocabulary" hidden>返回短文</button>
          <p class="empty" id="vocab-empty" role="status" hidden>无匹配词条</p>
          <div class="vocab-list" id="full-vocabulary-list"></div>
        </section>
      </div>
    </main>
    <dialog class="sheet" id="sync-dialog" aria-labelledby="sync-heading">
      <div class="sheet-head">
        <h2 id="sync-heading">GitHub 同步</h2>
        <button type="button" class="icon-button" id="close-sync" aria-label="关闭">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <form class="sheet-body" id="sync-form">
        <input class="field" id="sync-token" type="password" aria-label="GitHub 同步令牌" placeholder="github_pat_…" autocomplete="off" spellcheck="false" required>
        <div class="check-row">
          <label><input id="remember-sync" type="checkbox"> 记住令牌</label>
          <a href="https://github.com/settings/personal-access-tokens/new?name=Zhongkao+Reading+Lab&amp;target_name=Frank-Humingtao&amp;contents=write" target="_blank" rel="noopener noreferrer">创建令牌</a>
        </div>
        <div class="buttons"><button type="submit" class="button solid">连接并同步</button></div>
      </form>
      <div class="sheet-body" id="sync-actions" hidden>

          <button type="button" class="button solid" id="sync-now">立即同步</button>
          <button type="button" class="button" id="disconnect-sync">断开</button>
        </div>
      </div>
      <p class="sheet-status" id="sync-status" role="status"></p>
    </dialog>
    <div class="word-menu" id="word-menu" role="dialog" aria-label="出现篇目" hidden></div>
  </div>

  <script type="application/json" id="bilingual-text">
{
  "read-01": [["学校的戏剧与艺术社团排了一出戏，讲的是一个糊涂国王弄丢了王冠。","导演给每位演员分配了一段台词。","服装助理找来一件丝绸衬衫、一件羊毛外套和一双黑靴子。","我们在宫殿入口挂了块紫色帘子。","最后一次排练时，王冠不见了。","扮演侦探的演员打开橱柜，却只找到一把扫帚。"],["这时，王后听见一声巨响，低头往靠垫下面找。","我们原本就要在王冠旁放一把玩具枪。","这两样东西都在那里。","我们本可以不改戏，最后却把这场意外写进了剧本。","首演那晚，寻找王冠的一幕打破了场内的寂静，引来了整场演出中最响亮的笑声。"]],
  "read-02": [["校报编辑交给我一件不寻常的任务：采访书店里年纪最大的店员。","我带上数码相机、笔记本和一本街道指南。","路上，我在一家店的橱窗广告里看见了道路修建前那家书店的照片。","我征得店主同意，复制了那张照片。","到了书店柜台，店员告诉我，这家书店最初只有一架二手小说。"],["她请我把她的名字印对，并核实日期。","回到学校，我写了一篇文章，还给照片配了简短的说明。","我们一起选了个有意思的标题，希望能吸引读者。","校报出版后，有人送来了一张更早的照片，于是这则新闻又在网上接着报道。"]],
  "read-03": [["化学课上，一位科学家给了我们一碗清水和一张薄纸。","我们剪了一个小方块，用它把一根尖尖的金属针轻轻放到水面上。","纸沉了下去，针却浮着。","看起来就像魔法。","在实验报告里，我们把观察到的事实和对现象的解释分开写。"],["搭档提议用玻璃管滴一滴肥皂液。","肥皂液一碰到水，针就直沉碗底。","我们用同一套器材重复实验，得到了相似的结果。","对于经验不多的团队来说，清楚的记录确实能帮上大忙。"]],
  "read-04": [["博物馆开了一个太空展。","入口处摆着宇宙飞船模型、一颗卫星和一颗小行星模型，小行星后面还有面镜子。","一位工程师演示了灯光怎样形成影子。","一张图表展示了宇宙有多大。","哪怕是个简单的模型，也能让我惊叹。","我们让一个小球绕着灯转，看看为什么无论何时，行星总有一半处在黑暗中。"],["一个男孩问，宇航员能不能听见飞船外的声音。","导游解释说，声音需要借助物质传播。","接着，我们比较了地球到月球和到太阳的距离。","那些数字很难想象，导游便拿绳子来比划。"]],
  "read-05": [["我们的国际交流社团为地理活动制作了一张大地图。","一组同学在亚洲贴上中国、印度、日本和韩国的国旗。","另一组在欧洲标出了英国、法国、德国、希腊和俄罗斯。","一位加拿大来宾帮一个男孩把加拿大标在美国以北，周围还有许多小标签。","地图另一边，一位澳大利亚老师指给我们看澳大利亚在大洋洲的位置。"],["一位埃及学生把写着「埃及」的卡片放在非洲，并指出埃及与中东的联系。","为了表示太平洋，我们用了不少蓝纸，也留出了足够的空间贴标签。","最后，一位西班牙来宾补上了西班牙国旗，那是我们漏掉的许多面国旗之一。"]],
  "read-07": [["爷爷奶奶的老房子天花板很高，走廊很窄。","餐厅里有一张圆桌、一个木柜，还有一座连着棕色烟囱的壁炉。","楼上卧室的床上铺着厚被子。","我在窗边发现了一个谁也打不开的抽屉。","奶奶让我下楼，去取挂在厨房钩子上的小钥匙。"],["钥匙正好能用。","抽屉里有一只坏钟、一条银项链，还有以前的屋主留下的一封信。","爷爷和奶奶把信念了出来。","写信的人曾给孙辈们藏过几把钥匙。","另一把用旧胶带固定在一张画的背后。","爷爷从院子里的棚屋找来钉子，教我修好了松动的画框。"]],
  "read-08": [["车站附近有家舒服的小咖啡馆，供应早餐和午餐。","周六我去那里帮忙。","一位顾客点了咖啡、火腿三明治和苹果派。","我复述了点单，却在单子上写错了桌号。","另一位顾客点了热可可、汉堡和果汁。","厨师端出两份餐后，我把它们送反了。"],["一位安静的女士指着杯子，问饮品里有没有牛奶或其他东西。","我核对菜单，为出错道了歉。","我刚才没把点单念清楚。","再次送餐时，热苹果派的香味让人觉得很舒服。","到中午，我已经不用看单子就能记住是谁点了哪份餐。"]],
  "read-09": [["姑妈请我们吃晚饭。","我用一把锋利的刀切卷心菜、胡萝卜、土豆和洋葱。","表亲在锅里煎牛肉和猪肉，我一边煮米饭，一边做鸡肉玉米汤。","洋葱开始焦了，爷爷把锅从火上端开。","接着，他在碗里拌了点胡椒和盐。"],["妈妈想吃饺子，我们就包了几个，把剩下的面粉用来烤蛋糕。","吃饭时，表亲叉子上的一块土豆掉了下来。","年纪小的表弟更爱吃白米饭，我就给他做了个鸡蛋。","饭后，我们分着吃了一个梨，趁盘子还没在水槽里堆起来就把它们洗了。"]],
  "read-10": [["我在超市买了面包、黄油、奶酪、糖和一公斤苹果。","女店员看着我比较几瓶油。","除了最大瓶的按升算更贵，其余都很便宜。","我见她朝最便宜的那瓶点了点头。","结账时，我付了一张十美元纸币和几枚硬币。","找回的钱里有一枚二十五美分硬币。"],["出了店，我发现小票上多了别人的糖果。","女店员听我说完，核对了屏幕上的价格，马上把钱退给我。","原来排在我前面的男孩把糖果落在了收银机旁。","我为自己开口说明而感到高兴。","我道了谢，把小票塞进钱包。"]],
  "read-11": [["下雨的早晨，我走进一家小店买雨衣。","售货员先拿来一件绿色雨衣，又给我推荐了件灰色羊毛大衣。","我把两件分别套在毛衣外面试了试。","第一件穿起来肩膀太紧。","第二件够暖和，搭配我的裙子和衬衫却显得太长。","窗边的裁缝帮我量了手臂，拿了另一个尺码给我看。"],["那件衣服有一排整齐的纽扣，侧袋里也放得下手套。","我把旧夹克装进袋子，又给妹妹买了一双皮手套和厚袜子。","回家后，我在袋子上写下我们各自的名字，免得她拿错我的裤子。"]],
  "read-12": [["洪水过后，一群志愿者约好一起清理社区。","水退后，一个院子里堆了不少垃圾。","我们把垃圾分类，把空塑料瓶送到能回收的地方。","一位老人指给我们看，在新的垃圾桶到来前，大家都把废弃物放在哪里。","我们扫小路时，一个男孩捡到一个钱包。"],["我们把钱包交给警察，他让我们在附近找找失主。","三位邻居把袋子搬上卡车。","离开前，领队问我们还能做些什么来爱护自然。","有个孩子想拆掉一块鼓励吸烟的牌子。","另一个自告奋勇，要画块告示，请大家带走自己的垃圾。"]],
  "read-13": [["我醒来时头疼、咳嗽，嗓子疼得厉害。","我的肚子也疼。","妈妈量了我的体温，带我去医院。","护士问我不舒服多久了，然后领我去看医生。","候诊室里，一位病人正用冰袋敷膝盖。","一个牙疼的女孩脸色苍白，显得很疲惫。"],["医生让我深呼吸，还听了我的心跳。","好在他说不用拍 X 光片。","我发烧了，需要休息，不必吃药效强的药。","他写下如果我仍不舒服或疼痛加重，该怎么做。","回家后，爸爸给我端来水，我一觉睡到第二天早上。"]],
  "read-14": [["在表亲的农场上，一只白鹅站在装着小鸡的笼子旁。","我们喂了母鸡、一匹棕马和两头肥猪。","一只公鸡叫得很响，我们尽量不惊扰母鸡，又检查了羊圈的篱笆。","一只小山羊推开了门。","它从牛身旁跑过去，躲到一堆稻草后。"],["表亲让我别追。","他取来一把草，把手放低，耐心等着。","山羊慢慢走了出来。","一只可爱的小狗叫了起来，不过我们还是把山羊安全领了回去。","下午，我们在田边看见一只兔子，在更远的林边看见一只狐狸。","天黑前，农夫关上了所有的门。"]],
  "read-15": [["我们在日出前到了湖边。","老师让我们保持安静，站在低篱笆后观察。","一只鸭子带着小鸭游过，我还看见一条鱼浮到水面。","一只海鸥在头顶盘旋，一只鹅拍着翅膀，一只小鸟叼着草飞回巢去。","靠岸的地方，一根羽毛卡在树枝上，一条虫子在湿土里蠕动。"],["一只蝴蝶停在花上，旁边有只身体发绿的小虫。","我们翻看识别手册，试着认出每种动物。","离开前，我们捡走了一个可能伤到鸟的塑料袋。","在繁忙的马路附近，这样安静的地方可不多见。"]],
  "read-16": [["我们的足球队参加了青少年联赛。","教练以前拿过奥运冠军，希望每个队员都能进步。","他让我们先把球传到位，再想办法射门。","决赛前，我踢得很积极，却总习惯径直冲向球门。","队友提醒我要注意无球跑动。"],["下半场，我看到她飞快地甩开一名后卫。","我把球横传过去，她射门得分。","快结束时，对手差点追平，幸好守门员漂亮地扑出了球。","教练来祝贺我，我却向其他队友道了谢。","大家一起学会了什么是团队精神，这比奖品更有价值。"]],
  "read-17": [["在体育中心，指导老师邀请我们体验一项新运动，作为训练课程的一部分。","哥哥选了棒球，我跟着一个女孩练排球。","我们在体育馆里上了节短短的篮球课，接着去室外跑道上看接力赛。","一名跑者拿着蓝色接力棒，没减速就把它交给了下一位。"],["附近还有人在打乒乓球。","指导老师除了教我们怎么扔球，还给我们看了一张奥运会照片，说我们也可以试试高尔夫、网球，或在冬天去滑雪。","我原本以为只是来看看。","结束时我累得想坐下，却还是报名参加了下一节排球课。"]],
  "read-19": [["我们的青年乐队在一个礼堂演出，那里的扩音器声音很弱。","一位钢琴家弹起开场曲，小提琴手站在他身边。","指挥举起了手，可有一位歌手还在走廊里。","我的椅子被人挪走了。","我没抱怨，而是和别人合坐琴凳。","最开始的几个音符几乎听不见。"],["后来那位歌手到了，脚还疼着。","她在台阶上滑倒了，我们便给她搬了把椅子。","没想到观众开始鼓掌。","音乐会结束后，一个热门音乐节目派来的电台记者问起最后一首歌。","歌手说，有人认真听她唱，她就唱得更轻松。"]],
  "read-20": [["电脑课上，我们给一个年纪更小的孩子编了个小游戏。","玩家得用键盘让机器人朝各个方向移动，拼出它的名字，再点击按钮收集星星。","我写的第一段代码会让机器人跑出屏幕，再也回不来。","我看弟弟玩电脑游戏，借鉴了那个游戏处理边界的方式，终于弄明白了先前那处错误的原因。"],["老师让我先把新版本存到个人电脑上，再到学校网络里测试。","我下载了一张图片放到开始页面，用鼠标把它移到操作说明旁边。","弟弟喜欢这个游戏，不过他希望拿到最后一颗星星时能听到提示音。"]],
  "read-21": [["外公给我讲他们家以前怎么保持联系。","一封信可以坐火车穿过全国。","电报能更快地传递消息，但多发一个字就要多花钱。","外婆以前每月给姐姐打一次电话，总要连说两遍「再见」。","隔壁房间里，我看见了一台收音机、一台电视、一张 CD 和一张 VCD。"],["外公从光盘里放了一段短视频，让我看看他年轻时的样子。","那时，他家附近有家店可以传真消息。","现在他用电子邮件。","他说自己记性不好，却还留着当年报知我妈妈出生的那份电报。"]],
  "read-22": [["我给一个搬到国外的朋友写了张明信片。","我把它和一封短信装进信封，走到邮局。","「您要寄给谁？」邮递员问。","他看了邮编，发现那是另一个城市的。","我们核对了朋友的地址，又买了一张邮票，付了正确的邮资。"],["我差点把信封投进左边的邮箱，可他告诉我，寄往国外的邮件要放进里面那个更大的箱子，免得留在外面的雪地里。","我还要寄一个小包裹，他递给我一张表。","表上要填写里面装了什么、重量是多少。","寄出前，我改好了明信片，在背面写上自己的地址。"]],
  "read-23": [["我和侄女坐火车去乡下的一座小镇。","到了火车站，乘务员让我们换到另一个站台等候。","告示牌下站着一群人。","有位乘客把摩托车停在外面。","我从口袋里掏出来的却是公交车票。","侄女提醒我，新买的火车票放在我的手提包里。"],["我们得赶紧走，最后正好赶上火车，找到两个靠窗的座位。","经过一个道口时，我们看到了卡车、拖拉机，还有个工人骑着自行车从一辆坏自行车旁经过。","火车在一座正在维修的桥附近减了速。","我们晚到了，不过铁路博物馆的导游还为我们留着位置。"]],
  "read-24": [["我们刚到机场，航空公司就改了航班时间。","妈妈检查了一下护照，领我去服务台。","我问：「打扰一下，先生，这是我们要去的登机口吗？」","一位工作人员指给我们看该去哪个登机口，还说飞机是从东京飞来的，到得晚了。","那是我第一次坐飞机。"],["我从窗里看见另一架飞机缓缓转弯，一位飞行员朝地上的人挥手。","我们趁多出来的时间找了个安静的地方坐下，又买了一瓶水。","显示屏上的信息再次变动时，我们跟着工作人员去了新的入口。","飞机下午四点起飞，比原计划晚了近两个小时。"]],
  "read-25": [["我们一行人在西北的一处山谷附近露营。","我们在小溪旁搭帐篷，把湿衣服挂到绳子上。","到了黄昏，天阴了。","风刮起来了，大雨把帐篷打得直晃。","向导查看天气预警，让我们立刻离开那片危险的陡坡。","我们收好行李，沿林间小路走到下面更安全的地方。"],["早晨天冷，衣服已经开始冻硬了。","浓雾遮住最近的山丘。","有块牌子指向东北方的一座湖，向导却选了地势更低的路。","走过瀑布后，雾渐渐散去，最远的山峰也看得见了。"]],
  "read-27": [["在动物园，我帮一位有名的讲解员给游客制作指示牌。","费用由一位富有的捐赠者承担。","她带我看了熊、老虎、狮子和灰狼，然后去了熊猫馆。","在较暖和的区域，大象在水池边张开了嘴，骆驼在门旁等着。","袋鼠待在阴凉处。"],["两只猴子在树枝间跳来跳去，一只鹦鹉在笼里叫。","一个孩子把鼻子贴到了窗玻璃上。","介绍鹿的旧牌子放得太低，我们把它挪高了。","讲解员让我画些图，好让还不识字的孩子也能认出来。","后来，游客用新牌子找到了蛇区。"]],
  "read-28": [["一位农夫请我们到他的田里了解农活。","他带我们看了种小麦、玉米和棉花的地方。","春天，他会把种子播在河边松软的土里。","他留意气温，因为寒冷的夜晚可能伤到新长出来的苗。","前年有场旱灾，损害了他的小麦收成。","我们摘了熟葡萄和几个瓜。"],["他切开一个橙子分给大家。","老师问，秋收对村子意味着什么。","他去年卖出去一吨土豆。","好收成能让人有钱修东西，也能让一家小店继续开下去。","我们带着一鞋泥离开，对他的工作也多了一份敬意。"]],
  "read-29": [["弟弟以为大家都忘了他的生日。","爸爸在上班，妈妈出去买东西，爷爷奶奶也没打过电话。","侄女帮我把蛋糕藏在冰箱里，表亲带来了气球和贺卡。","我们让弟弟带小狗出去，爷爷奶奶趁机进了屋。","他们的孙子回家时，还以为只是吃顿平常的饭。"],["姑妈和叔叔已经在厨房等着。","宝宝睡着了，我们没有大声庆祝。","姑妈亲了弟弟一下，他高兴极了。","他笑着央求我们把秘密告诉他。","当看见那张把他画成头戴王冠、样子歪歪扭扭的画像时，他笑得眼泪都出来了。"]],
  "read-31": [["我们的英语口语社请来一位美国人、一位来自英格兰的英国老师、一名韩国学生和一位印度来宾。","一个日本女孩向大家问好，让我们猜她的家乡。","一个对中国文化感兴趣的亚洲同学通过照片认出了东京。","一名德国男孩和一名俄罗斯女孩把自己的名字写在黑板上。"],["一个法国人画了一条法国的街道，另一名法国学生念出了街名。","最后，一位阿拉伯来宾给我们展示了一件传统服装。","有人问，来自西方国家的人是不是总会把自己称作「西方人」。","我们热热闹闹地聊起各种打招呼的方式。","到最后，教室里谁都不觉得自己是个外人。"]],
  "read-32": [["图书社负责人是位腼腆的图书管理员，她请我布置一个图书展台。","我们挑了一本讲盲人艺术家成名的畅销书，又放了一本看似枯燥的墨水史。","一个爱画画的男孩选了第二本，觉得它更有意思。","书里有幅插图，画着一位用动物毛做的笔作画的画家。"],["男孩写了几句话，把纸条当书签夹了进去。","第二天，同校的一个同学就来借这本书。","到星期五，已经有六个学生排队等着借。","谁也不想一直等，管理员就列了个名单。","她说，跟朋友分享知识的快乐，比海报更能让孩子们对书产生兴趣。"]],
  "read-33": [["数学课上，胡老师出了个关于实数的挑战题。","先要估算四个麻袋的重量。","一袋十五公斤，一袋十八公斤，第三袋二十一公斤。","第四袋四十六公斤，加起来刚好一百公斤。","接着，我们要把八乘十一，或者把四十四乘二，再把结果除以二。"],["我误把八十八写成了七十七，就用橡皮改了过来。","老师在黑板上画了个带加号、减号和空格的图。","她提示说，空格里是八十到九十之间的数。","我们要让等式两边相等。","我们得给出确切的数字和理由。"]],
  "read-34": [["几何课上，何老师让我们到室外画个大圆。","我们用了粉笔、一根绳子和一把标着英寸和厘米的尺。","一名同学站在圆心，我拉直绳子，绕他走一圈，画出圆的轮廓。","这个圆的面积接近一平方米。","然后我们画了第二个圆，直径只有前一个的一半，猜两个圆的面积差多少。"],["回到座位上，我打开铅笔盒，拿出一支笔写下结果。","同学用小卷笔刀帮我削了铅笔。","一开始我出了错，不过老师说，能把错误解释清楚，可能跟找到正确答案一样有用。"]],
  "read-35": [["班主任吴老师让我们做一份校历。","一月有考试，二月放假，三月五日有写作比赛。","四月要参观大学。","五月八日有科学展，一周后有全体会议。","六月十六日有场音乐会。","七月和八月的出游活动，我们用了不同的颜色标记。"],["新学期从九月开始。","十月有运动会，十一月有图书义卖，十二月有圣诞庆祝活动。","一位女校长帮我检查日期。","我把周一的活动写到周二了，是个常见的错误。","她还让我至少留出一个空闲周末。","不然，我们的休息日怎么办呢？"]],
  "read-36": [["周一，我们的英语课从一次有趣的听写开始。","周二，我们查词典了解一个习语，又学了课文里一些词的拼法。","周三生物课上，我们观察了一片叶子。","周四是物理课。","来访的物理学家让我们猜哪个物体会先落地。","周五，一位严格的校长看着班长收作业。"],["我差点忘了自己的作业。","我在日记里写道：「别忘了下一篇短文。」","我还得完成一篇短文、一篇作文和一张语法练习。","我给每门课都安排了一个下午。","到了周六，我可以复习笔记，周日就读小说放松。","爸妈对我的安排很满意。"]],
  "read-37": [["学校办了一次开放日。","黑板旁的椅子上放着一个塞满课本的书包。","一群学生向家长展示他们怎样收集和比较信息。","演示时，老师读了一个句子，请每个孩子跟着念。","另一位老师让来访者翻译一段简短的对话。","我看见一个字写得很工整的学生，用生活里的例子给同班同学解释一个难懂的短语。"],["老师祝贺她有了进步。","体育课上，附近学校来的一位青少年在操场上领大家做运动。","有位家长问哪项技能最重要。","校长笑着说，弄懂一个问题，往往比很快给出答案更有用。"]],
  "read-38": [["健康展上，一位护士解释了普通小病和癌症这类严重疾病的区别。","一位失聪的志愿者讲了她失去听力的经历，还展示了她怎样理解交谈内容。","眼科医生让我读视力表。","牙医让我拿着一颗牙的模型，又告诉我怎样用牙刷和牙膏。"],["我画了张图，说明为什么要保护牙齿。","另一间屋里，一位病人描述了肚子疼时的感受。","我很高兴学到了回家能和家人分享的东西。","好习惯有帮助，不过办展的人也希望我们知道什么时候该寻求帮助。"]],
  "read-39": [["在一座很大的博物馆里，导游解释了为什么一个古代王朝要在河边建造宏伟的宫殿。","一幅画里有一支带着大炮的军队、一名拿箭的士兵和一个倒酒的仆人。","历史学家指着一座纪念碑，讲述了一座国王陵墓是怎样被发现的。","另一间展室里摆着金字塔模型和一条泥塑的龙。"],["一幅画描绘了国王死后在天堂的样子。","那幅画可能已经有一千年了。","我问哪样东西最难保存。","一位工作人员说，一点污垢都可能损坏一块旧布。","导游让我们想象那个世纪的人看重什么。","我选了最小的一只花瓶来画。"]],
  "read-40": [["在青年论坛上，我们讨论了一家工厂可能怎样污染空气、影响环境。","一位发言人认为，政府应该制定规定，防止学校附近出现烟尘。","一位来自联邦贸易团体的商人不同意，提到了这会给公司带来的成本。","一名工人说，健康和工作场所的安全也值得重视。","下结论前，我们尽量公平地把各方观点说清楚。"],["一位当地的秘书听完讨论，主动提出把建议转交市长。","我写道，如果新规定能增加对清洁技术的需求，而且大家理解它的意思，规定就可能起作用。","这场讨论最终没有达成一致，不过大家更明白这个问题为什么关系到自己的家庭。"]],
  "read-41": [["暑假里，当地旅游部门派了工作人员去海滩。","一位女游客问哪里能租到独木舟。","海滩上的向导说，划船只在划定的区域里才安全。","妹妹更想冲浪，可天气预报说浪会很大。","风太大了，两样都不适合玩，我们就沿着海岸散步，看一艘船驶向港口。"],["有个渔民在岩石旁补渔网。","他告诉我们，日落前海浪会漫过小路。","我们及时掉头回去。","妹妹在酒店附近的游泳池练跳水。","我戴着太阳镜坐在阴凉处，看着岬角后面的阳光渐渐消失。"]],
  "read-43": [["我和妹妹去市中心一家店剪头发。","我给理发师看了学校的照片，请她帮个忙：耳朵上面的头发能留长一点吗？","妹妹原本想要一条亮粉色丝带，看到抽屉里有条红的，又改了主意。","等候时，我读了一本介绍电影明星的杂志。"],["理发师问我最喜欢哪位演员。","我说，我倒更喜欢演员旁边那只傻乎乎的狗。","后来，妹妹梳好头发，穿上粉色 T 恤，笑了起来。","我咬住嘴唇忍住笑。","她让我给她拍张照。","结果棒极了，比我们以前的学校照片好看多了。"]],

  "read-50": [["中秋节前夜，一对夫妇帮忙布置院子。","他们在大门上方挂灯笼，还在每张桌子上放了一支蜡烛。","邻居带来一块月饼、一些巧克力和十二只杯子。","为了庆祝，我们打算唱歌跳舞，热热闹闹地过一晚。","点蜡烛前许愿是我们的传统。","一个戴纸帽子的孩子问，月亮真的是金子做的吗？"],["姐姐讲起了一个有趣的故事。","「从前，有一位天使来到了人间。」","后来，我们摇响铃铛，欢迎一户刚搬来的人家。","到了午夜，孩子们还醒着。","他们拥抱道别，答应下次聚会也带上自家的节日食物。"]],

  "read-53": [["我们班参观了一家工厂，那里生产装有小马达的橡胶玩具。","技术员演示怎样在工作台上装小型压机，再把轮子固定在金属杆上。","我们给马达盖了一个黄色盖子。","我不小心用错了零件型号，玩具动不了。","一位专家帮我检查，还教我怎样正确操作机器。"],["轮班时间长容易让工人疲劳，所以他们会休息。","工厂用附近燃煤电厂的电，并为每台机器单独做日常记录。","哪怕只是很快做一次小心的测试，我们也得遵守安全规则。","工厂关门时，我的玩具已经不用再改，就能载着一点东西从地板上跑过去。"]],
  "read-54": [["一支科学考察队白天穿过沙漠，去研究一座人工建造的塔。","空气干燥，天气热得厉害。","还不到中午，口渴就成了问题。","一位同行者看见东方扬起一阵尘土，想往前冲，向导却让我们保持镇定。"],["我们在岩石的一个深洞里休息，洞里凉爽，光线也很暗。","后来，一场突如其来的风暴扬起沙子，盖住了路牌和拐弯处。","向导用工具把牌子挖了出来。","我们得以继续朝西走，没有迷路。","回到营地，我写下这片奇特的风景，也写了自己对走错路的担心。"]],
  "read-55": [["一个村民看见丛林小路旁有只动物，走起路来很吃力。","它还活着，前腿却被陷阱夹伤了。","村民没有拽着它的尾巴把它拖出来，而是叫人来帮忙。","医生检查了伤口，说它能活下来。","村民之前还以为它死了。","这个陷阱是用来除鼠的，不是用来捕捉大型动物的。"],["一位工作人员提醒，突如其来的声音可能吓坏动物，让它攻击人。","救护人员保持安静，小心行事。","后来他们把动物放回一片保护区。","有那么一瞬间，我们还能看见它背上厚厚的皮毛。","我来不及拍照，它就跑进草丛，不见了。"]],

  "read-57": [["集市上，一位女士卖冰淇淋、香蕉面包和抹果酱的吐司。","她还卖果汁、可乐和热可可。","一位醉酒的顾客想再要些啤酒，她拒绝了。","叔叔要开车，所以选了水。","我什么都想尝尝，可没钱全买。","朋友选了火鸡肉和一份沙拉。"],["我买了巧克力，把剩下的钱留了下来。","旁边有两个孩子吃得闹哄哄的。","其中一个把热果酱放到舌头上，只好吐出来。","桌子底下蹲着一只猫，等着吃肉。","摊主叫我们别喂它。","我们都觉得，吐司是那里最便宜、也最好吃的东西。"]],
  "read-58": [["在大学里，一位发明家给我们展示了她的第一项发明。","有了它，学生只用一根手指就能翻页。","她试过好几种设计，一个也没成功。","最后成功的版本看起来容易使用，做出来却很难。","有学生问她是怎么做到的。","她说，技术上的新发现，有时就始于日常生活中遇到的麻烦。"],["她的教授曾鼓励她专注解决实际问题，不必追求名气。","她让我们试用装置，又问我们想为自己的教室发明什么。","我明白了，大脑可以尝试不同方法来解决问题，也明白了一个有潜力的想法为什么往往需要时间。"]],
  "read-59": [["在辩论社，一名学生觉得让大家交同样的费用不公平。","另一名学生说，平等意味着给每个家庭同等的参与机会。","我们知道，改变收费办法肯定不能让所有人都满意。","我们比较了不同意见，又向一个公共团体的成员请教。","一位从省里来的访客说，规则很难做到十全十美。"],["法律或政策上的变化可能有帮助，但人们也有责任听听彼此的意见。","我们可以表达自己的看法，平等地对待别人，无须坚持只有一个答案。","最后，我们给提出抱怨的家庭写了封礼貌的回信。","我们想让下一组人了解，这个决定在实际生活中意味着什么。"]],
  "read-60": [["在一座战争纪念馆，导览员给我们看了一位士兵很久以前写的学校报告。","他离开家乡，去和自己并不了解的敌人作战。","其中一封信写着：「亲爱的同志，希望这封信能送到你手上。」","下面，一位护士写道，一个受伤的陌生人如果没有水喝，可能会死。","她没问他属于哪一方，就给了他水。"],["导览员说，这些小小的善举值得记住。","我以前以为，英雄一定要赢一场大仗。","那天下午，我想到，帮助一个从小就被教导要憎恨的人，会不会也是一种勇气？","导览员觉得，这些做法体现了一种兄弟情谊。","我把这句话记下来，也想了想我们生活的这个世界。"]],
  "read-61": [["电影院举办了一场短片节。","第一部是发生在太平洋上的动作片。","一位船长让一名乘客上了船。","原来这个人是个小偷，想偷食物，还企图抢劫另一位旅客。","一声枪响之后，受害者说出了关于一桩谋杀案的真相。","我们还看了一部以夜总会为背景的短歌剧。"],["和第一部片子相比，歌剧听起来有点无聊，结尾却让我落了泪。","一位影迷问，在多雾的伦敦拍电影要花多少钱。","导演说，这要看是什么故事。","拍碰撞场面可能很贵，但只用一台摄像机，也能拍出很美的电影。","短片节办得很成功。"]],
  "read-62": [["六月二十日，我们班打开了五十年前学生们埋下的时间胶囊。","每个抽屉都属于一个人。","九号抽屉里有一份九年级女生写的报告。","报告里说，她希望十九岁毕业，当一名老师。","这是她的梦想。","十六号抽屉属于一个想学会用吉他弹四十首歌的男孩。","十七号抽屉里有十七张照片，最后一张记录了照片主人过七岁生日的样子。"],["第十二个抽屉里有十二张邮票，还有一张便条，记着五月二十一日的出游，距我们第一次出游已有二十年。","一个听我们讲的孩子问，为什么要留这么普通的东西。","我说，它们能让我们想象，当时的主人看重什么。","那些邮票中有七张来自国外。"]],
  "read-63": [["今天十点，电视台让一个女孩念天气预报。","首都是晴天，最高三十度。","北边的山谷最高十三度。","今晚，海岸和南边的山谷都不会暖和。","情况还可能变糟。","平时遇上刮风的日子，主持人会先测试屏幕。","这次屏幕显示零度，可她知道平常的读数高得多。"],["节目进行到一半，电视台也可能遇上突然的变动。","制片人给了她一张新图表。","上面写着东南十六度、西南十四度。","昨天还是温和的春天气候，现在她出门却得穿外套了。"]],
  "read-64": [["小时候，我总觉得家务是家庭主妇的活儿。","爸妈把从周一堆到现在的家务交给我和哥哥，我们才改了想法。","哥哥爱做饭，工作日也能把晚饭做好，但我得整理客厅、拖地。","起初我犯懒，总是拖到很晚。"],["后来，年纪小的双胞胎表亲来家里玩。","一个举起一只长袜问：「妈妈，这是我们俩的，还是他们的？」","我让他们自己看看上面写了谁的名字。","他们找到了各自的衣服，自己穿好。","我们之前把衣服扔得到处都是。","我列了张简单的家务清单，把它钉在厕所旁边。"]],
  "read-65": [["朋友把球打到街上时，我生了气。","我说她那一下打得蠢，吵了一架后就退出了游戏。","回家后我很难受。","我刚才太没礼貌了，要是不把实话讲出来，说不定会失去这个朋友。","想到这里，我决定实话实说。","我写了一封道歉信。","「对不起，我对你大喊大叫了。」"],["「我后悔把一整天最糟的情绪都发泄在你身上。」","她打电话来，我心里好受多了。","她说，我们明天还可以一起玩。","听见她的声音，我很高兴。","刚才我们一心想打败对方，都忘了玩球本来是为了开心。","希望下周也是这样。","以后每次一起玩，我都会记住这一点。"]],
  "read-66": [["姑妈带我们去了西部的一座山地公园。","晨雾很浓，但我们还能慢慢往上爬。","向导指给我们看一个野餐地点。","「不管走哪条路，」她说，「记得穿靴子，带足饮用水。」","妹妹已经渴了。","我递给她一瓶水，两人坐在一块石头上。"],["一位父亲带着个子很高的儿子，停下来问我们已经走了多远。","我们说，找到块石头就可以坐下歇歇。","云雾终于散开，我们看见壮丽的风景。","我们在一棵树下吃东西，互相猜谜语。","野餐很简单，却是我最喜欢的一项假期活动。"]],
  "read-67": [["向导带我们参观了一个古老王国的首都。","一幅画里，国王穿着长礼服站在人群中。","他身旁是一位开路的先行者，在跨山贸易兴盛时开辟了一条更安全的路线。","那个人出生在贫穷的村庄，谁也没想到他会到王宫觐见。","传说他站出来，告诉国王西边有危险。"],["国王听完，同意给山谷准备一批食物。","向导说，实际发生的事情可能没这么戏剧化。","即便如此，人们依旧敬佩他，因为他保护了几座差点被洪水毁掉的城镇。","省里有位住在旧教堂附近的画家，画了好几幅关于这趟旅程的作品。"]],
  "read-68": [["一位教育专家请我们想象一所现代学校，学生可以在任何地方学习。","有人建议开一门不评分的网上课。","另一人说，一个人全靠自己不可能学好外语。","有位教师提出，只要不需要特殊设备，学生就可以上网课。","网课之外也能安排和老师见面，尤其是练口语时。"],["我们决定每周拿出一天，让每个人选择自己的学习方式。","给我们的建议是安排团队合作，否则好点子也可能派不上用场。","这样，我们就有了一个关于新学校如何运转的好例子。","老师请我们说清楚最喜欢哪部分，以及为什么。"]],
  "read-70": [["「嘿，这是谁的伞？」一档广播问答节目的主持人问。","一位来电者说是她的。","「不好意思？","你说这是你的？」主持人问。","第二位来电者说：「都不是。","蓝色那把是我的。","这把是我们班的。」","主持人问她怎么知道。","「我们亲手把名字写上去了。」她说。","电台里的一个男孩找到了标签。"],["「哦，知道你们班还在用这把伞，真好。」","「你们过来拿吧。」主持人说。","一位来电者问：「好，我们今天过来行吗？」","「行。」主持人答道。","「你可以自己问老师。」女孩说。","「她就在这儿。」","他们决定节目结束后过来。"]],
  "read-73": [["我们的科技展在九点开始。","五支队伍争夺决赛名额。","八十号队造了一台会敲门的机器人。","九十号队用小风扇把纸旗吹得来回摆动。","第六组的机器人动不了，第七组的供电装置出了问题。","我帮第九组读了屏幕上的一条操作说明。"],["我学会了怎样给小组指导，又不把活儿全揽过来。","一名评委说，重点在于学会把不同的点子联系起来。","到中午，已有六十位参观者在名字旁打勾投票。","活动结束时，又有七十人给了我们表扬和反馈。","我们列了一张清单，写下次还可以试些什么。"]],
  "read-74": [["爷爷找到一张他们决定结婚那天的照片，说：「呀，我都忘了这张。」","奶奶当时买了一条漂亮的蓝裙子，爷爷戴的是他父亲的领带。","他们的孙女问，为什么照片上谁都不显得高兴。","爷爷说，那时相机拍得慢，没人敢动。","第二张照片里，他把孙女的妈妈抱在膝上。"],["孙女的爸爸站在旁边，笑得很好看。","我们很庆幸还有这些照片。","奶奶说，穿衣打扮会变，可善意和好笑话总能让生活过得更好。","一张照片可以留一辈子。","最后，我把她的话写下来。","这是我想保留的一段私人的回忆，她也很高兴我问起了这些事。"]],
  "read-75": [["一位保安一早带我们参观了一座用来召开联合国会议的建筑。","他让我们看入场证，核对上面的号码。","一位女士问，另一扇门是不是逃生通道。","保安直接回答了她。","他说那的确是逃生通道，还告诉我们发生火灾或地震时该怎么办。"],["我们把包放在安全的地方，上了楼。","一群来自欧洲某国的人刚到，大厅里热闹起来。","一位年轻的来宾说：「请告诉我们可以坐在哪里。」","保安指向一个安静的角落。","我们看着来自不同国家的人商谈那些一个国家无法独自解决的问题。"]],
  "read-77": [["盛夏时，我去上了一堂游泳课。","几个孩子已经准备跳下水，至少站在池边看上去是这样。","我腿疼，不敢跟着跳。","老师叫我坐到她旁边，先伸一只脚试试。","水很凉，不过光照到了水面，我看得见池底。"],["一个男孩跳下去，声音太大，把另一名孩子吓了一跳。","「无论做什么，都不要推别人。」老师说。","她关上门，暂停课程解释规则。","下课时，我的腿还疼。","我期待下次还能来。","起初我觉得没希望，现在我已经学会开口请人帮忙，不再担心别人笑话我。"]],
  "read-80": [["我给一个从大陆搬去岛上的女孩写信。","她说，最难的是刚去时一个人也不认识。","海很美，但她说：「最近哪里都不像家。」","有时，她走一英里，只为坐在岩石上想想事情。","我问她，在那里有没有找到自己喜欢的音乐。"],["她给我发来一首学校里很流行的歌。","「我以前羡慕姐姐，」她写道，「她很快就能交到朋友，我却几乎总是害羞。","不过，现在我已经不总是难过了，我想自己会一直好下去。」","我听了两遍那首歌，回信说我相信她。","我也祝她好运。"]]
}
