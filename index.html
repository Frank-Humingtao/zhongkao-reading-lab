<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中考英语阅读标词</title>
  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131518" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.ico?v=2" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" sizes="16x16" href="icon-16.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="48x48" href="icon-48.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.json?v=2">
  <script id="theme-settings">
    const themeStorageKey = "zhongkao-reading-theme";
    const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
    let preferredTheme;
    try {
      preferredTheme = localStorage.getItem(themeStorageKey);
    } catch {
      // The system preference still applies if local storage is unavailable.
    }

    function updateTheme() {
      const dark = preferredTheme === "dark" || (preferredTheme !== "light" && systemTheme.matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      const toggle = document.getElementById("dark-mode");
      if (toggle) {
        toggle.setAttribute("aria-pressed", dark);
        toggle.setAttribute("aria-label", dark ? "切换到浅色" : "切换到深色");
      }
    }

    updateTheme();
  </script>
  <link rel="stylesheet" href="site.css">
  <style>
    .shell {
      max-width: 1120px; margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) var(--gutter) calc(64px + env(safe-area-inset-bottom));
    }

    /* ---------- View bar: 文章 / 词汇表 + 中英 / 目录 ---------- */
    .viewbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 8px;
      margin: 10px calc(-1 * var(--gutter)) 0; padding: 10px var(--gutter);
      background: var(--bg);
    }
    .tabs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--fill); min-width: 0; }
    .tab { padding: 6px 14px; border-radius: 999px; color: var(--ink-2); font-size: .92rem; white-space: nowrap; }
    .tab:hover { color: var(--ink); }
    .tab[aria-expanded="true"],
    .tabs:not(:has([aria-expanded="true"])) #open-reader {
      background: var(--tab-on); color: var(--ink); box-shadow: 0 1px 3px #0000001a;
    }
    .viewbar-end { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 12px; border-radius: 999px; color: var(--ink-2); font-size: .92rem; white-space: nowrap;
    }
    .pill:hover { background: var(--fill); color: var(--ink); }
    .pill:disabled:hover { background: none; color: var(--ink-2); }
    .pill[aria-pressed="true"] { background: var(--solid); color: var(--on-solid); }
    .pill .icon { width: 18px; height: 18px; }
    body:has(#reader[hidden]) #toggle-bilingual,
    body:has(#reader[hidden]) #toggle-listening { display: none; }
    .storage-error { margin-top: 8px; color: var(--accent); font-size: .9rem; }

    /* ---------- Layout ---------- */
    .layout {
      display: grid; grid-template-columns: 220px minmax(0, 1fr);
      align-items: start; gap: clamp(24px, 4vw, 56px); margin-top: 18px;
    }
    .layout.directory-closed { grid-template-columns: minmax(0, 1fr); }
    .navigation { position: sticky; top: 70px; min-width: 0; }
    .directory-closed .navigation { display: none; }
    .directory-entries {
      max-height: calc(100vh - 100px); overflow: auto; display: grid; gap: 1px;
      scrollbar-width: none; overscroll-behavior: contain;
    }
    .directory-entries::-webkit-scrollbar { display: none; }
    .directory-lesson {
      display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 8px 12px;
      border-radius: 10px; text-align: left; font-size: .9rem; color: var(--ink-2);
    }
    .directory-lesson:hover, .directory-lesson[aria-current="page"] { background: var(--fill); color: var(--ink); }
    .directory-number { flex: 0 0 1.6em; color: var(--muted); font-family: var(--english); font-variant-numeric: tabular-nums; }
    .directory-status { margin-left: auto; flex: 0 0 auto; color: var(--ok); }
    .surface { min-width: 0; max-width: 700px; }
    .directory-closed .surface { margin-inline: auto; }

    /* ---------- Article ---------- */
    .reading-head { padding-top: 8px; }
    .reading-title {
      font-family: var(--english); font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.18;
      letter-spacing: -.01em; outline: none;
    }
    .translated-title { margin-top: 8px; color: var(--ink-2); font-size: clamp(1.15rem, 3vw, 1.4rem); }
    .reading-body { margin-top: 26px; }
    .reading-figure { margin: 0 0 28px; }
    .reading-illustration {
      display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover;
      border-radius: 16px; background: var(--fill);
    }
    .reading-figure.wide .reading-illustration { aspect-ratio: auto; object-fit: contain; }
    .reading-credit, .reading-sources { color: var(--muted); font-size: .82rem; line-height: 1.55; }
    .reading-credit { display: grid; gap: 4px; margin-top: 8px; }
    .reading-credit a, .reading-sources a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    .reading-sources { clear: both; margin-top: 22px; }
    .passage { font: 1.22rem/1.85 var(--english); color: var(--ink); }
    .passage-block + .passage-block { margin-top: 1em; }
    .passage.bilingual .passage-block + .passage-block { margin-top: 1.5em; }
    .translation { display: none; margin-top: .5em; color: var(--ink-2); font: .86em/1.8 var(--chinese); }
    .passage.bilingual .translation { display: block; }
    .passage.bilingual .aligned-sentence.matched { background: var(--fill); border-radius: 4px; }
    .word {
      display: inline; border-radius: 4px; font: inherit; letter-spacing: inherit; line-height: inherit;
      text-align: inherit; -webkit-tap-highlight-color: transparent;
    }
    @media (hover: hover) {
      .word:hover { background: var(--fill); }
    }
    .word[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
    .inline-gloss { color: var(--muted); font: .7em var(--chinese); overflow-wrap: anywhere; margin-left: .15em; }
    .inline-gloss[data-fixed-gloss] { white-space: nowrap; }
    .word-keep { white-space: nowrap; }
    .word.located { outline: 2px solid var(--accent); outline-offset: 2px; }

    .reading-foot {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
      margin-top: 44px; padding-top: 20px; box-shadow: inset 0 1px var(--hair);
    }
    .foot-button { min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: .95rem; color: var(--ink-2); }
    .foot-button:hover:not(:disabled) { background: var(--fill); color: var(--ink); }
    #previous { justify-self: start; }
    #finish-lesson { background: var(--fill); color: var(--ink); }
    #finish-lesson:hover { background: var(--fill-hover); }
    #finish-lesson[aria-pressed="true"] { background: none; color: var(--ok); }
    #next { justify-self: end; background: var(--solid); color: var(--on-solid); }
    #next:hover { background: var(--solid); opacity: .9; }

    /* ---------- Reading questions ---------- */
    .quiz { margin-top: 40px; padding-top: 24px; box-shadow: inset 0 1px var(--hair); }
    .quiz-title { font-size: 1rem; color: var(--muted); font-weight: 600; }
    .question { margin: 22px 0 0; padding: 0; border: 0; min-width: 0; }
    .question-stem { padding: 0; font: 1.08rem/1.6 var(--english); color: var(--ink); }
    .question-options { display: grid; gap: 8px; margin-top: 10px; }
    .question-option {
      display: flex; gap: 12px; align-items: baseline; width: 100%; min-height: 44px; padding: 10px 14px;
      border-radius: 12px; background: var(--fill); color: var(--ink); text-align: left;
      font: 1rem/1.5 var(--english); -webkit-tap-highlight-color: transparent;
    }
    .question-option span:last-child { min-width: 0; overflow-wrap: anywhere; }
    .option-letter { flex: 0 0 auto; font-weight: 600; color: var(--muted); }
    @media (hover: hover) { .question-option:hover:not(:disabled) { background: var(--fill-hover); } }
    .question-option[aria-pressed="true"] { background: var(--solid); color: var(--on-solid); }
    .question-option[aria-pressed="true"] .option-letter { color: inherit; }
    .question-option:disabled { cursor: default; }
    .question-option.correct { background: none; color: var(--ok); box-shadow: inset 0 0 0 2px var(--ok); }
    .question-option.correct .option-letter { color: inherit; }
    .question-option.correct::after { content: "✓"; margin-left: auto; }
    .question-option.wrong { background: var(--accent-soft); color: var(--accent); }
    .question-option.wrong .option-letter { color: inherit; }
    .question-option.wrong::after { content: "✗"; margin-left: auto; }
    .quiz-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 22px; }
    .quiz-status { color: var(--muted); font-size: .95rem; }
    .quiz-status.all-right { color: var(--ok); }
    .quiz-action { background: var(--solid); color: var(--on-solid); }
    .quiz-action:disabled { background: var(--fill); color: var(--muted); }
    .passage-figure, .question-figure { margin: 1em 0; }
    .passage-figure img, .question-figure img {
      display: block; max-width: 100%; height: auto; margin-inline: auto; border-radius: 10px; background: #fff;
    }
    .question-figure { margin: 10px 0 0; }
    .word.underlined { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }

    /* ---------- 词汇表 ---------- */
    #resume-vocabulary { display: none; }
    .empty { padding: 48px 0; text-align: center; color: var(--muted); }
    .feedback { margin-top: 8px; color: var(--ok); font-size: .9rem; }
    .feedback:empty { display: none; }
    .vocab-search {
      width: 100%; margin-top: 14px; padding: 12px 16px; border: 0; border-radius: 12px;
      background: var(--fill); color: var(--ink); font: inherit; font-size: 1rem;
    }
    .vocab-list { margin-top: 18px; }
    .vocab-letter { padding: 18px 0 4px; color: var(--muted); font: 1rem var(--english); }
    .vocab-entry { padding: 7px 0; font-size: .95rem; line-height: 1.65; }
    .vocab-entry p { min-width: 0; overflow-wrap: anywhere; }
    .term-button, .entry-word { text-align: left; color: var(--ink); }
    .term-button:hover, .entry-word:hover { color: var(--accent); }
    /* Holding a word opens the word menu, not the phone's own copy / look-up callout. */
    .word, .entry-word { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    .entry-word { font: 1.1rem var(--english); margin-right: .4em; }

    /* ---------- Word menu ---------- */
    .word-menu {
      position: fixed; z-index: 50; width: min(300px, calc(100vw - 16px)); max-height: min(460px, 65vh);
      overflow-y: auto; overscroll-behavior: contain; padding: 6px;
      background: var(--raised); border-radius: 16px; box-shadow: var(--shadow);
    }
    .word-menu-title { padding: 8px 10px 6px; font-size: .85rem; color: var(--muted); overflow-wrap: anywhere; }
    .word-menu-item { display: block; width: 100%; padding: 9px 10px; border-radius: 10px; text-align: left; font-size: .92rem; }
    .word-menu-item:hover, .word-menu-item:focus, .word-menu-item.speaking { background: var(--fill); }
    .word-menu .feedback { padding: 0 10px 6px; }

    @media (min-width: 1000px) {
      .reading-body::after { content: ""; display: block; clear: both; }
      .reading-figure { float: right; width: 46%; margin: .45em 0 18px 28px; }
      .reading-illustration { border-radius: 14px; }
    }

    /* ---------- Listening (in the app only, see listening.js) ---------- */
    .passage.listening .aligned-sentence {
      color: var(--ink-2); border-radius: 4px; padding: 1px 2px; margin: 0 -2px;
      -webkit-box-decoration-break: clone; box-decoration-break: clone;
      transition: background-color .25s;
    }
    .passage.listening p[lang="en"] > .aligned-sentence.spoken { background: var(--accent-soft); color: var(--ink); }
    .passage.listening .aligned-sentence.matched { background: none; }
    /* Each sentence's Chinese right under it, instead of the paragraph's translation. */
    .passage.listening .translation { display: none; }
    .listening-zh {
      display: block; margin: 2px 0 10px; color: var(--muted); font: .8em/1.7 var(--chinese);
      transition: color .25s;
    }
    .listening-zh.spoken { color: var(--ink-2); }
    body.listening .shell { padding-bottom: calc(132px + env(safe-area-inset-bottom)); }
    .player-bar {
      position: fixed; z-index: 6; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; gap: 14px;
      padding: 14px var(--gutter) calc(18px + env(safe-area-inset-bottom));
      background: var(--bg); color: var(--ink-2); font-size: .9rem;
    }
    .player-position {
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform .4s linear;
    }
    .player-toggle {
      display: inline-flex; align-items: center; justify-content: center; flex: none;
      width: 40px; height: 40px; border-radius: 999px; background: var(--solid); color: var(--on-solid);
      -webkit-tap-highlight-color: transparent;
    }
    .player-toggle .icon { width: 18px; height: 18px; stroke-width: 2.4; }
    .player-toggle .icon.filled { fill: currentColor; stroke-width: 1.4; }
    .player-control {
      display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 2px;
      white-space: nowrap; color: var(--ink-2); -webkit-tap-highlight-color: transparent;
    }
    #player-narration { color: var(--ink); }
    #player-speed { font-variant-numeric: tabular-nums; }
    #player-double[aria-pressed="false"], #player-timer[aria-pressed="false"] { color: var(--muted); }
    #player-double[aria-pressed="true"] { color: var(--ink); }
    #player-timer { margin-left: auto; }
    #player-timer .icon { width: 17px; height: 17px; }

    @media (max-width: 760px) {
      .layout { grid-template-columns: minmax(0, 1fr); gap: 0; margin-top: 0; }
      .navigation { position: static; margin: 4px 0 18px; }
      .directory-entries { max-height: min(46vh, 360px); padding: 6px; border-radius: 16px; background: var(--raised); }
      .directory-lesson { min-height: 40px; align-items: center; }
      .tab { padding: 6px 12px; }
      .pill .pill-text { display: none; }
      .pill { padding: 8px; }
      .reading-body { margin-top: 20px; }
      .reading-figure {
        margin-inline: calc(-1 * var(--gutter)); width: calc(100% + 2 * var(--gutter)); max-width: none;
        margin-bottom: 22px;
      }
      .reading-illustration { border-radius: 0; }
      .reading-credit { margin-inline: var(--gutter); }
      .passage { font-size: 1.16rem; line-height: 1.8; }
      .reading-foot { margin-top: 36px; }
      .foot-button { padding: 0 12px; }
    }
  </style>
  <script type="module" src="site-nav.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.6 4.5 4.5 0 0 0 7 18.5Z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"/></symbol>
    <symbol id="i-translate" viewBox="0 0 24 24"><path d="M3.5 5.5h9M8 3.5v2M10.5 5.5c-.8 3.6-3.2 6.4-6.5 8M5.5 8.5c1 2.2 2.8 3.9 5 5"/><path d="m12.5 20.5 4-9 4 9M14 17.5h5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9.5 6 6 6-6"/></symbol>
    <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4.5 17.5V13a7.5 7.5 0 0 1 15 0v4.5"/><path d="M4.5 14.5h1.2a1.8 1.8 0 0 1 1.8 1.8v2.4a1.8 1.8 0 0 1-1.8 1.8h-.2a1 1 0 0 1-1-1Zm15 0h-1.2a1.8 1.8 0 0 0-1.8 1.8v2.4a1.8 1.8 0 0 0 1.8 1.8h.2a1 1 0 0 0 1-1Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6.5v11M15 6.5v11"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.5 6.6v10.8a1 1 0 0 0 1.5.86l8.6-5.4a1 1 0 0 0 0-1.72L10 5.74a1 1 0 0 0-1.5.86Z"/></symbol>
  </svg>
  <div class="shell">
    <header class="topbar">
      <h1 class="visually-hidden" id="site-title">中考英语阅读标词</h1>
      <div class="switch" id="site-switch">
        <button type="button" class="switch-button" aria-haspopup="true" aria-expanded="false" aria-controls="switch-menu">
          <span class="switch-label">筛选短文</span><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg>
        </button>
        <nav class="switch-menu" id="switch-menu" aria-label="阅读资料" hidden></nav>
      </div>
      <div class="tools">
        <a class="text-button" id="vocab-link" href="vocab.html">生词</a>
        <button type="button" class="icon-button" id="dark-mode" aria-pressed="false" aria-label="切换到深色">
          <svg class="icon theme-moon" aria-hidden="true"><use href="#i-moon"/></svg>
          <svg class="icon theme-sun" aria-hidden="true"><use href="#i-sun"/></svg>
        </button>
        <button type="button" class="icon-button" id="open-sync" aria-haspopup="dialog" aria-label="GitHub 同步">
          <svg class="icon" aria-hidden="true"><use href="#i-cloud"/></svg>
        </button>
      </div>
    </header>
    <div class="viewbar">
      <div class="tabs" role="group" aria-label="视图">
        <button type="button" class="tab" id="open-reader">文章</button>
        <button type="button" class="tab" id="open-vocabulary" aria-controls="full-vocabulary" aria-expanded="false">完整词汇表</button>
      </div>
      <div class="viewbar-end">
        <button type="button" class="pill" id="toggle-listening" aria-controls="player-bar" aria-pressed="false" aria-label="听" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-headphones"/></svg><span class="pill-text">听</span>
        </button>
        <button type="button" class="pill" id="toggle-bilingual" aria-controls="passage" aria-pressed="false" aria-label="中英对照">
          <svg class="icon" aria-hidden="true"><use href="#i-translate"/></svg><span class="pill-text">中英</span>
        </button>
        <button type="button" class="pill" id="directory-toggle" aria-controls="directory-panel" aria-expanded="true">
          <svg class="icon" aria-hidden="true"><use href="#i-list"/></svg><span class="pill-text">目录</span><span id="directory-arrow" hidden></span>
        </button>
      </div>
    </div>
    <p class="storage-error" id="storage-error" role="status" hidden>无法保存到本地。</p>
    <main class="layout" id="workspace">
      <nav class="navigation" aria-label="短文目录">
        <div class="directory-entries" id="directory-panel" aria-label="短文篇目"></div>
      </nav>
      <div class="surface">
        <article id="reader" aria-labelledby="reading-title">
          <header class="reading-head">
            <h2 class="reading-title" id="reading-title" lang="en" tabindex="-1"></h2>
            <p class="translated-title" id="translated-title" hidden></p>
          </header>
          <div class="reading-body">
            <figure class="reading-figure" id="reading-figure" hidden>
              <img class="reading-illustration" id="reading-illustration" width="960" height="640" alt="" decoding="async">
              <figcaption class="reading-credit" id="reading-credit" hidden></figcaption>
            </figure>
            <div class="passage" id="passage"></div>
            <section class="quiz" id="quiz" aria-label="阅读理解" hidden></section>
            <p class="reading-sources" id="reading-sources" hidden></p>
          </div>
          <footer class="reading-foot">
            <button type="button" class="foot-button" id="previous">上一篇</button>
            <button type="button" class="foot-button" id="finish-lesson" aria-pressed="false">标为已读</button>
            <button type="button" class="foot-button" id="next"></button>
          </footer>
        </article>
        <section id="full-vocabulary" aria-labelledby="full-vocabulary-title" hidden>
          <h2 class="visually-hidden" id="full-vocabulary-title" tabindex="-1">完整词汇表</h2>
          <input class="vocab-search" type="search" id="vocab-search" aria-label="搜索词汇" placeholder="搜索">
          <button type="button" id="resume-vocabulary" hidden>返回短文</button>
          <p class="empty" id="vocab-empty" role="status" hidden>无匹配词条</p>
          <div class="vocab-list" id="full-vocabulary-list"></div>
        </section>
      </div>
    </main>
    <div class="player-bar" id="player-bar" hidden>
      <span class="player-position" id="player-position"></span>
      <button type="button" class="player-toggle" id="player-toggle" aria-label="暂停">
        <svg class="icon" aria-hidden="true"><use href="#i-pause"/></svg>
      </button>
      <button type="button" class="player-control" id="player-narration" aria-label="朗读方式">中英</button>
      <button type="button" class="player-control" id="player-speed" aria-label="语速">1.0×</button>
      <button type="button" class="player-control" id="player-double" aria-pressed="false">两遍</button>
      <button type="button" class="player-control" id="player-timer" aria-pressed="false" aria-label="睡眠定时">
        <svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg><span class="player-timer-value"></span>
      </button>
    </div>
    <dialog class="sheet" id="sync-dialog" aria-labelledby="sync-heading">
      <div class="sheet-head">
        <h2 id="sync-heading">GitHub 同步</h2>
        <button type="button" class="icon-button" id="close-sync" aria-label="关闭">
          <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <form class="sheet-body" id="sync-form">
        <input class="field" id="sync-token" type="password" aria-label="GitHub 同步令牌" placeholder="github_pat_…" autocomplete="off" spellcheck="false" required>
        <div class="check-row">
          <label><input id="remember-sync" type="checkbox" checked> 记住令牌</label>
          <a href="https://github.com/settings/personal-access-tokens/new?name=Zhongkao+Reading+Lab&amp;target_name=Frank-Humingtao&amp;contents=write" target="_blank" rel="noopener noreferrer">创建令牌</a>
        </div>
        <div class="buttons"><button type="submit" class="button solid">连接并同步</button></div>
      </form>
      <div class="sheet-body" id="sync-actions" hidden>
        <div class="buttons">
          <button type="button" class="button solid" id="sync-now">立即同步</button>
          <button type="button" class="button" id="disconnect-sync">断开</button>
        </div>
      </div>
      <p class="sheet-status" id="sync-status" role="status"></p>
    </dialog>
    <div class="word-menu" id="word-menu" role="dialog" aria-label="出现篇目" hidden></div>
  </div>
  <script src="word-press.js"></script>
  <script src="progress-sync.js"></script>
  <script type="module" src="reading-page.js"></script>
  <script type="module" src="listening.js"></script>
</body>
</html>
