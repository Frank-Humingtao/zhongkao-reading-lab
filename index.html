  "lessons": [
    {"topic":"校园戏剧","title":"The Missing Costume","paragraphs":["Our school theatre and art club planned a play about a foolish king who loses his crown. The director assigned each actor a speech. The costume assistant found a silk blouse, a woolen coat, and black boots. We hung a purple curtain at the palace entrance. At our final practice, the crown was missing. The actor playing a detective opened a cupboard and found only a broom.","Then the queen heard a big bang and looked beneath a cushion. We always had to lay a toy gun beside the crown. Both were there. We could have refused to change the play, but we added the accident to the script. On opening night, the search broke the silence and earned the loudest laugh of the whole performance."],"id":"read-01","primary":["accident","art","assistant","bang","big","black","blouse","broom","curtain","cushion","detective","foolish","gun","lay","loud","performance","purple","queen","refuse","search","silence","silk","speech","theatre","whole","woolen","director","then"],"review":["boot","cupboard","night","palace","toy","break","coat"]},
    {"topic":"校园新闻","title":"Who Gets to Tell the Story?","paragraphs":["The editor of our school newspaper gave me an unusual task: interview the oldest worker in the bookshop. I took a digital camera, a notebook, and a street directory. On the way, an advertisement in a shop window showed an image of the bookshop before the road was built. I asked the owner for permission to copy it. At the counter, the worker told me that the bookstore had started with a shelf of used novels.","She asked me to print her name correctly and check the date. Back at school, I wrote an article and a short caption for the photograph. Together, we chose a clever headline that might attract readers. When the paper came out, someone brought us an even older picture, so the news story continued online."],"id":"read-02","primary":["advertisement","article","attract","bookshop","bookstore","caption","clever","digital","directory","newspaper","print","shelf","task","unusual","continue","count","date","news","notebook","novel","together","photograph","start","street","road","paper","short","check"],"review":["copy","build","camera","even","owner","shop","story"]},
    {"topic":"科学实验","title":"A Coin That Would Not Sink","paragraphs":["During chemistry class, a scientist gave us a bowl of clean water and a thin piece of paper. We cut a small square and used it to lower a sharp metal needle onto the surface. The paper sank, but the needle stayed up. It looked like magic. In our lab report we separated fact from explanation.","My partner suggested adding a drop of soap with a glass tube. When the soap touched the water, the needle went straight to the base of the bowl. We repeated the experiment with the same equipment and got a similar result. For a team without much experience, a clear record is a genuine advantage."],"id":"read-03","primary":["advantage","base","chemistry","clear","experience","experiment","fact","lab","magic","needle","scientist","separate","soap","thin","bowl","equipment","glass","metal","onto","repeat","sharp","sink","suggest","clean","cut","low","go","small"],"review":["same","square","touch","drop","during","record","straight"]},
    {"topic":"太空展厅","title":"The Dark Side of the Model","paragraphs":["The museum opened a space exhibition. At the entrance were a model of a spaceship, a satellite, and a small planet with a mirror behind it. An engineer showed us how light from a lamp could produce a shadow. A chart showed how huge the universe is. Even a simple model can amaze me. We moved a ball around the lamp to see why half of a planet is dark at any moment.","A boy asked whether an astronaut could hear noise outside a spacecraft. Our guide explained that sound needs matter to travel through. Then we compared the distance from Earth to the moon with the distance to the sun. The numbers were hard to imagine, so the guide used string."],"id":"read-04","primary":["amaze","engineer","exhibition","lamp","mirror","planet","satellite","spaceship","sun","travel","universe","any","dark","huge","moment","moon","noise","produce","earth","half","hear","light","model","space","ball","through","why","see"],"review":["entrance","hard","matter","museum","chart","imagine","simple"]},
    {"topic":"世界地图","title":"A Map for the Welcome Hall","paragraphs":["Our international club made a large map for a geography event. One group marked Asia with flags for China, India, Japan, and Korea. Another group marked Europe and added Britain, France, Germany, Greece, and Russia. A Canadian visitor helped a boy place Canada north of the U.S.A., among many smaller labels. On the other side of the map, an Australian teacher showed us where Australia belongs in Oceania.","An Egyptian student put a card for Egypt in Africa and pointed out its links with the Middle East. We certainly needed plenty of blue paper for the Pacific Ocean and left enough space for labels. At the end, a Spanish guest added a flag from Spain, one of many flags we had missed."],"id":"read-05","primary":["africa","asia","australia","australian","britain","canada","canadian","certainly","china","egypt","egyptian","europe","geography","germany","greece","india","international","japan","korea","many","map","middle east","north","oceania","plenty","russia","spanish","the pacific ocean","u.s.a."],"review":["among","flag","france","guest","miss","space"]},
    {"topic":"老房子","title":"The Room Behind the Dining Room","paragraphs":["My grandparents' old house had a high ceiling and narrow hall. The dining-room had a round table, a cupboard made of wood, and a fireplace under a brown chimney. Upstairs, the bedroom had a thick quilt on the bed. Near the window, I found a drawer that nobody could open. Grandma sent me downstairs for a small key on the kitchen hook.","It fit. Inside were a broken clock, a silver necklace, and a letter from a former owner. Grandpa and his wife read it aloud. The writer had hidden keys for her grandchildren. Another was behind a picture, held in place by old tape. Grandpa showed me how to mend the loose frame with a nail from the yard shed."],"id":"read-07","primary":["bed","bedroom","ceiling","chimney","clock","dining-room","downstairs","fireplace","fit","grandchild","mend","nail","necklace","quilt","round","tape","wife","wood","brown","cupboard","kitchen","narrow","drawer","letter","thick","nobody","place","another"],"review":["broken","high","key","yard","form","grandma","grandparents"]},
    {"topic":"小餐馆","title":"An Order for the Wrong Table","paragraphs":["A pleasant café near the station serves breakfast and lunch. I helped there on Saturday. A customer ordered coffee, a ham sandwich, and apple pie. I read the order back, but put the wrong table number on the card. Another customer had asked for cocoa, a hamburger, and fruit juice. When the cook brought out both orders, I carried them to opposite tables.","A quiet woman pointed at the cup and asked whether the drink contained milk or anything else. I checked the menu and apologized for the mistake. I had failed to read the order clearly. The smell of warm pie made the second trip quite pleasant. By noon, I could remember who had ordered each meal without looking at the card."],"id":"read-08","primary":["anything","apologize","breakfast","café","clearly","coffee","drink","fail","fruit juice","ham","hamburger","lunch","milk","pie","quite","sandwich","serve","smell","apple","cup","meal","menu","saturday","wrong","card","both","read","put"],"review":["cocoa","customer","pleasant","else","noon","order","trip"]},
    {"topic":"家常聚餐","title":"One Pot for Six People","paragraphs":["My aunt invited us to dinner. I used a sharp knife to cut cabbage, carrot, potato, and onion. My cousin fried beef and pork in a pan while I cooked rice and made soup with chicken and corn. When the onion began to burn, Grandpa took the pan off the heat. Then he mixed pepper and salt in a bowl.","Mum wanted dumplings, so we made a few and used the remaining flour to bake a cake. At the table, my cousin dropped a potato off his fork. My younger cousin preferred plain rice, so I made him an egg. After supper, we shared a pear and washed the plates before they could pile up in the sink."],"id":"read-09","primary":["bake","beef","cabbage","carrot","chicken","dinner","dumpling","egg","fork","fry","knife","onion","pan","pear","pepper","plate","pork","rice","salt","heat","potato","prefer","soup","few","cook","table","after","before"],"review":["bowl","burn","cake","corn","sharp","sink","aunt"]},
    {"topic":"超市采购","title":"The Receipt in My Pocket","paragraphs":["At the supermarket, I bought bread, butter, cheese, sugar, and a kilo of apples. The salesgirl watched me compare bottles of oil. All were cheap except the largest, which cost more per litre. I saw her nod at the cheapest bottle. At the check-out, I handed over a ten-dollar note and a few coins. The change included a quarter.","Outside the store, I noticed someone else's candy on my bill. The saleswoman listened, checked the price on the screen, and immediately gave me the money back. The boy in front of me had left his candy beside the machine. I felt proud when I spoke up. I thanked her and tucked the receipt into my wallet."],"id":"read-10","primary":["bill","butter","candy","check-out","coin","except","kilo","nod","oil","price","proud","quarter","salesgirl","saleswoman","store","sugar","supermarket","wallet","cheese","immediately","include","machine","bread","cost","speak","bottle","which","beside"],"review":["apple","cheap","front","note","thank","all","few"]},
    {"topic":"服装店","title":"A Coat for a Rainy Day","paragraphs":["It was a rainy morning when I entered a small shop to buy a raincoat. The salesman brought me a green one, then offered me a grey wool overcoat. I tried both on over my sweater. The first felt too tight around my shoulders. The second was warm enough but looked too long with my skirt and shirt. A tailor near the window helped me measure my arm and showed me another size.","It had a neat row of buttons and room for gloves in the side pocket. I put my old jacket in a bag and bought a pair of leather gloves and thick socks for my sister. At home, I wrote our names on the bags so she would not take my trousers by mistake."],"id":"read-11","primary":["arm","enter","glove","grey","jacket","leather","overcoat","pair","raincoat","rainy","row","salesman","shirt","size","skirt","sock","sweater","tailor","trousers","wool","neat","enough","mistake","morning","shop","side","offer","help"],"review":["button","green","pocket","thick","warm","around","both"]},
    {"topic":"社区服务","title":"A Useful Saturday","paragraphs":["A volunteer group agreed to meet and clean the neighbourhood after a flood. Water had left piles of rubbish in a yard. We sorted the rubbish and took empty plastic bottles to a place that could recycle them. An elder showed us where people used to leave their waste before the new dustbin arrived. While we swept the path, a boy found a purse.","We left it with a police officer, who asked us to look for its owner nearby. Three neighbours carried bags to the truck. Before we left, the leader asked how we could care for nature. One child wanted to remove a sign that encouraged smoking. Another offered to draw a sign asking people to take their litter away."],"id":"read-12","primary":["dustbin","elder","empty","leader","litter","meet","nature","police","recycle","rubbish","smoking","sweep","three","waste","care","encourage","flood","neighbourhood","plastic","truck","volunteer","yard","away","neighbour","pile","them","group","look"],"review":["purse","office","agree","arrive","clean","nearby","bottle"]},
    {"topic":"医院门诊","title":"At the Clinic","paragraphs":["I woke with a headache, a cough, and a horrible sore throat. My stomach hurt, too. My mother checked my temperature and took me to the hospital. A nurse asked how long I had felt sick, then showed me to a doctor. In the waiting room, a patient held an ice pack against his knee. A girl with a toothache looked pale and tired.","The doctor asked me to breathe deeply and listened to my heart. Luckily, he said there was no need for an X-ray. I had a fever and needed rest, not a strong pill. He wrote down what to do if I still felt ill or my pain became severe. At home, my father brought water, and I slept until the next morning."],"id":"read-13","primary":["breathe","cough","deeply","fever","headache","heart","horrible","hospital","ice","ill","knee","pale","pill","severe","sick","sleep","stomach","toothache","until","wake","x-ray","pack","strong","temperature","rest","become","still","take"],"review":["against","pain","patient","tired","doctor","hurt","no"]},
    {"topic":"乡村动物","title":"The Gate Was Open","paragraphs":["At my cousin's farm, a white goose stood beside a cage of chicks. We fed the hens, a brown horse, and two fat pigs. A cock crowed loudly, so we tried not to disturb the hens, then checked the fence around the sheep. A young goat had pushed the gate open. It ran past a cow and hid behind a pile of straw.","My cousin told me not to chase it. He fetched a handful of grass, held it low, and waited. The goat came out slowly. A cute dog barked, but we got the goat safely back inside. In the afternoon, we saw a rabbit at the edge of the field and a fox farther off near the forest. The farmer closed every gate before dark."],"id":"read-14","primary":["chick","cock","cow","cute","disturb","farm","fat","fetch","forest","fox","goat","hen","horse","loudly","pig","rabbit","sheep","white","cage","farmer","field","afternoon","off","run","cousin","gate","two","tell"],"review":["brown","close","dark","dog","edge","farther","fence"]},
    {"topic":"湿地观鸟","title":"A Quiet Morning Near the Water","paragraphs":["We reached the lake before sunrise. Our teacher asked us to stay quiet and watch from behind a low fence. A duck swam past with its young, and I saw a fish rise to the surface. A seagull circled above us, a goose flapped its wings, and a little bird carried grass to its nest. Near the shore, we saw a feather caught on a branch and a worm moving in the wet earth.","A butterfly sat on a flower beside an insect with a green body. We looked through a guide and tried to identify each animal. Before leaving, we picked up a plastic bag that could harm the birds. A silent place like that is rare near a busy road."],"id":"read-15","primary":["bird","body","butterfly","duck","feather","fish","insect","nest","seagull","silent","sunrise","swim","worm","busy","catch","circle","fence","goose","green","harm","lake","shore","wet","pick","behind","stay","sit","each"],"review":["little","plastic","above","animal","earth","flower","grass"]},
    {"topic":"体育联赛","title":"The Goal That Was Not Mine","paragraphs":["Our football team joined a junior league. Our trainer, a former Olympic winner, wanted each player to improve. He asked us to make a proper pass before trying to score. Before the final match, I was active, but I had a bad habit of running straight toward the goal. My teammate told me to pay attention to movement off the ball.","In the second half, I saw her race past a defender. I kicked the ball across the field, and she scored. The other side nearly caught up near the end, but our goalkeeper made a fine save. When the coach came to congratulate me, I thanked the others. Learning team spirit together was worth more than the prize."],"id":"read-16","primary":["active","bad","congratulate","fine","football","goal","improve","junior","kick","league","match","movement","nearly","olympic","prize","proper","score","spirit","trainer","winner","worth","thank","toward","across","past","other","than","want"],"review":["attention","catch","field","habit","player","race","together"]},
    {"topic":"运动体验日","title":"Try a Sport You Don't Know","paragraphs":["At the sports centre, an instructor invited us to try a new activity as part of a training programme. My brother chose baseball, and I joined a girl who was practising volleyball. In the gym, we took a short lesson in basketball, then went outdoors to watch a relay race on the track. A runner carried a blue stick and passed it to the next person without slowing down.","Some people were playing ping-pong nearby. Besides showing us how to throw the ball, our instructor showed us a photo from the Olympic Games and said we could also try golf, tennis, or skiing in winter. I had only expected to watch. By the end, I was tired enough to sit down, but I signed up for another volleyball lesson."],"id":"read-17","primary":["baseball","basketball","besides","golf","gym","olympic games","ping-pong","programme","relay","runner","ski","stick","throw","track","training","volleyball","winter","activity","expect","race","sport","tired","pass","person","invite","carry","up","by"],"review":["centre","outdoors","join","ball","blue","brother","enough"]},
    {"topic":"音乐演出","title":"The Band with One Less Chair","paragraphs":["Our youth band had a concert in a hall with a weak loudspeaker. A pianist played the first tune while a violin player stood beside him. The conductor raised his hand, but one singer was still in the corridor. Someone had moved my chair. Rather than complain, I shared the piano bench. The first notes were hardly audible.","Then the singer arrived with a sore foot. She had slipped on the steps, so we moved a chair for her. The audience began to clap, a pleasant surprise. After the concert, a radio journalist from a popular music show asked about the last song. The singer said it was easier to sing when the others listened to her."],"id":"read-19","primary":["band","hardly","journalist","loudspeaker","pianist","piano","raise","sing","singer","surprise","violin","weak","chair","complain","concert","foot","player","pleasant","step","youth","music","rather","song","hand","share","someone","while","so"],"review":["conductor","popular","hall","radio","stand","last","other"]},
    {"topic":"技术课堂","title":"A Game for My Little Brother","paragraphs":["In computer class, we wrote a short game for a younger child. The user had to move a robot in any direction with a keyboard, spell its name, and click a button to collect stars. My first piece of code let the robot leave the screen and never come back. I finally managed to realise the cause of the unknown error by watching my brother play a computer game and copying the way its border worked.","My teacher told me to save the new version on a P.C. before testing it on the school network. I downloaded a picture for the start page and used a mouse to put it beside the directions. My brother liked the game itself but asked for a sound when he reached the last star."],"id":"read-20","primary":["code","computer","computer game","direction","download","keyboard","mouse","network","p.c.","realise","user","button","cause","copy","error","game","itself","manage","never","page","spell","unknown","save","test","sound","piece","school","used"],"review":["any","robot","star","start","collect","screen","way"]},
    {"topic":"旧物展","title":"How We Sent the News","paragraphs":["My grandfather showed me how his family used to keep in touch. A letter crossed the country by rail. The telegraph was a faster means of sending news, but every extra word on a telegram cost money. My grandmother called her sister on the telephone once a month and always said bye twice. In the next room I found a radio, a television, a CD, and a VCD.","He played a short video from the disc so I could see him as a young man. In those days, a shop near his house could fax a message. Now he uses e-mail. He says he is forgetful, but he still keeps the telegram that announced my mother's birth."],"id":"read-21","primary":["birth","bye","cd","e-mail","fax","forgetful","means","rail","telegram","telegraph","telephone","television","vcd","video","cross","message","month","once","those","touch","every","man","always","money","word","use","call","how"],"review":["news","twice","fast","now","cost","house","letter"]},
    {"topic":"邮局","title":"A Postcard for the Wrong City","paragraphs":["I wrote a postcard to a friend who had moved abroad. I put it in an envelope with a short letter and walked to the post office. “To whom are you sending it?” asked the postman. He looked at the postcode and noticed that it belonged to a different city. We checked my friend's address, then bought a stamp and paid the correct postage.","I almost dropped the envelope into the postbox on the left, but he said mail for another country went into a larger box inside so it would not remain outside in the snow. He handed me a form for a second packet. It asked about the contents and weight. I fixed the card before sending it and wrote my address on the back."],"id":"read-22","primary":["box","city","envelope","fix","left","mail","packet","postage","postbox","postcard","postcode","postman","snow","whom","abroad","post","stamp","weight","correct","drop","form","notice","office","remain","different","you","second","would"],"review":["card","hand","country","friend","inside","walk","almost"],"overrides":{"left":"left"}},
    {"topic":"铁路出行","title":"The Ticket in the Wrong Pocket","paragraphs":["My niece and I took a train to a town in the countryside. At the railway station, a conductor told us to wait beside a different platform. A crowd stood under the notice board. One passenger had left his motorbike outside. I pulled a bus ticket out of my pocket instead of the train ticket. My niece reminded me that I had put the new one in my handbag.","We had to hurry, but we boarded just in time and found two seats facing the window. At a crossing we saw a truck, a tractor, and a worker riding his bike beside a broken bicycle. The train slowed near a bridge under repair. We reached our stop late, but the guide at the railway museum had saved our places."],"id":"read-23","primary":["bicycle","bike","bridge","bus","countryside","crossing","crowd","handbag","hurry","motorbike","railway","tractor","broken","conductor","face","passenger","pocket","ride","ticket","train","museum","niece","pull","repair","slow","under","worker","his"],"review":["seat","truck","board","late","notice","save","town"]},
    {"topic":"机场中转","title":"When the Board Changed","paragraphs":["An airline changed the time of our flight just as we reached the airport. My mother checked her passport and took me to the desk. I asked, “Excuse me, sir, are we at the right gate?” A worker showed us which gate to use and said that the aircraft had arrived late from Tokyo. It was the first time I had ever flown in an airplane.","Through the window I saw another plane turn slowly and a pilot wave to someone on the ground. We used the extra time to find a quiet seat and buy a bottle of water. When the board changed again, we followed a member of staff to the new entrance. The flight left at 4 p.m., almost two hours later than planned."],"id":"read-24","primary":["aircraft","airline","airplane","airport","ever","flight","hour","p.m.","passport","pilot","plane","sir","excuse","member","seat","tokyo","board","entrance","follow","late","right","wave","desk","just","plan","quiet","water","when"],"review":["again","mother","through","gate","someone","use","window"]},
    {"topic":"山地露营","title":"Wind on the Ridge","paragraphs":["Our group went camping near a valley in the northwest. We put up a tent beside a stream and hung wet clothes on a line. By dusk, the sky had become cloudy. Wind rose and rain fell heavily and shook the tent. Our guide checked the weather warning and asked us to move away immediately from a steep, dangerous slope. We packed our bags, took a narrow path through the trees, and found a safer place farther down.","In the morning, the cold had begun to freeze our clothes. Thick fog hid the nearest hill. A sign pointed northeast to a lake, but the guide chose the lower road. After we walked past a waterfall, the fog began to lift and we could see the farthest peak."],"id":"read-25","primary":["cloudy","dangerous","dusk","farthest","fog","freeze","heavily","hill","line","northeast","northwest","rain","sky","steep","tent","warning","wind","camp","clothes","farther","lift","tree","valley","weather","hang","point","guide","from"],"review":["immediately","lake","narrow","pack","wet","away","rise"]},
    {"topic":"动物园志愿日","title":"The Sign Was Hard to Read","paragraphs":["At the zoo, I helped a well-known guide make signs for visitors. A rich donor had paid for them. She showed me a bear, a tiger, a lion, and a gray wolf, then led me to the panda house. In a warmer area, an elephant opened its mouth near a pool, and a camel waited beside a gate. A kangaroo stayed in the shade.","Two monkeys moved from branch to branch while a parrot called from a cage. A child pressed his nose against a window. An old sign for a deer was too low to read, so we moved it. The guide asked me to draw pictures for children who could not yet read the names. Later, visitors used the new sign to find the snakes."],"id":"read-27","primary":["bear","camel","deer","elephant","kangaroo","lion","monkey","mouth","nose","panda","parrot","rich","snake","tiger","well-known","wolf","yet","zoo","against","pool","press","lead","house","warm","area","window","child","not"],"review":["cage","low","stay","them","draw","later","pay"]},
    {"topic":"种植与收获","title":"Waiting for the Harvest","paragraphs":["A farmer invited us to learn about farming on his farmland. He showed us where he grew wheat, corn, and cotton. In spring he would sow seeds in the soft soil near the river. He checked the temperature because a cold night can harm new growth. A drought had damaged his wheat crop the year before. We picked ripe grapes and a few melons.","Then he cut open an orange and shared it with us. Our teacher asked what an autumn harvest meant to the village. He had sold a ton of potatoes last year. A good harvest could pay for repairs or keep a small family business open. We left with muddy shoes and more respect for his work."],"id":"read-28","primary":["autumn","business","cotton","crop","drought","farming","farmland","grape","grow","harvest","melon","orange","shoe","soft","soil","sow","ton","wheat","corn","growth","night","river","sell","year","because","last","where","he"],"review":["farmer","harm","potato","spring","temperature","village","good"]},
    {"topic":"家庭和邻里","title":"A Birthday Without a Big Party","paragraphs":["My younger brother thought everyone had forgotten his birthday. Dad was at work, Mom was shopping, and our grandparents had not phoned. My niece helped me hide a cake in the fridge, and our cousin brought a balloon and a card. When we sent my brother outside with our puppy, Grandpa and Grandma slipped into the house. Their grandson came home expecting an ordinary meal.","Instead, his aunt and uncle were waiting in the kitchen. We did not make a lot of noise because the baby was asleep. His aunt greeted him with a kiss, much to his delight. My brother laughed happily and began to beg us to tell him our secret. He began to cry with laughter when he saw the crooked drawing of himself in a crown."],"id":"read-29","primary":["asleep","baby","balloon","beg","cry","dad","delight","fridge","grandson","happily","kiss","lot","mom","phone","secret","shopping","cake","drawing","greet","himself","uncle","aunt","grandparents","brother","hide","home","do","make"],"review":["expect","kitchen","meal","noise","birthday","niece","ordinary"]},
    {"topic":"国际笔友","title":"Different Words for Home","paragraphs":["Our English-speaking club invited an American from America, a British teacher from England, a Korean student, and an Indian visitor. A Japanese girl said hello and asked us to guess her hometown. An Asian classmate interested in Chinese culture knew it was Tokyo from a photo. A German boy and a Russian girl wrote their names on the blackboard.","A Frenchman drew a picture of a street in France, and another French student pronounced the name. Lastly, an Arab guest showed us a traditional dress. Someone asked if a person from a Western country always called himself a westerner. We had a lively conversation about ways to greet someone. By the end, nobody felt like a foreigner in the classroom."],"id":"read-31","primary":["america","american","arab","asian","chinese","culture","england","english-speaking","foreigner","french","frenchman","german","hello","hometown","indian","japanese","korean","lively","pronounce","russian","traditional","western","westerner","france","guest","draw","their","write"],"review":["british","classmate","classroom","conversation","greet","himself","interest"]},
    {"topic":"图书馆故事","title":"An Unexpected Best-Seller","paragraphs":["A shy librarian who was head of our book club asked me to arrange a library display. We picked a best-seller, a tale about a blind artist who becomes famous, alongside a boring-looking book about the history of ink. A boy who loved painting chose the second book, which he found more interesting. A drawing showed a painter with a brush made from animal hair.","He wrote a short description and tucked it into the book as a bookmark. The next day, his schoolmate came back to borrow it. By Friday, the librarian had a queue of six pupils waiting for the book. Nobody wanted to wait forever, so she made a list. She said the joy of sharing knowledge with a friend could excite children more than a poster."],"id":"read-32","primary":["artist","best-seller","blind","bookmark","borrow","brush","description","display","excite","forever","head","history","ink","interesting","joy","knowledge","librarian","library","love","queue","schoolmate","six","book","friday","tale","choose","as","me"],"review":["drawing","famous","hair","painter","post","list","painting"]},
    {"topic":"数学接力","title":"The Hundred-Kilogram Guess","paragraphs":["For our mathematics lesson, Ms. Hu set a challenge about real numbers. First, we had to estimate the weight of four sacks. One sack weighed fifteen kilograms, one eighteen, and a third twenty-one. The fourth weighed forty-six, making a total of one hundred. Next, we had to multiply eight by eleven, or double forty-four, then divide the result by two.","I wrote seventy-seven instead of eighty-eight and used an eraser to correct the figure. On the blackboard, our teacher drew a chart with a plus sign, a minus sign, and a blank space. She gave us a hint: it was between eighty and ninety. We had to make both sides equal. We had to give the exact number and a reason."],"id":"read-33","primary":["blank","challenge","divide","double","eight","eighteen","eighty","eleven","eraser","exact","fifteen","four","fourth","hundred","kilogram","mathematics","minus","ms.","multiply","ninety","plus","reason","twenty-one","weigh","result","sign","next","one"],"review":["equal","third","total","weight","blackboard","correct","real"]},
    {"topic":"几何课","title":"A Circle in the Playground","paragraphs":["In geometry class, Mr. He asked us to make a large diagram of a circle outdoors. We used chalk, a piece of rope, and a ruler with both inch and centimetre marks. One pupil stood in the centre while I pulled the rope straight and walked around him to trace its shape. Our design covered almost a square metre. We then drew a second circle half as wide and guessed the difference in area.","At my desk, I opened my pencil-box and took out a pen to write the result. A classmate sharpened my pencil using a small sharpener. I had made a mistake in the beginning, but my teacher said that explaining an error could be as useful as finding the right answer."],"id":"read-34","primary":["chalk","geometry","inch","metre","mr.","pen","pencil","pencil-box","ruler","shape","sharpen","sharpener","useful","beginning","centre","classmate","cover","difference","outdoors","square","wide","guess","straight","mark","pupil","stand","him","that"],"review":["circle","diagram","error","half","pull","right","answer"]},
    {"topic":"校历志愿者","title":"Without a Blank Weekend","paragraphs":["Miss Wu, our headteacher, asked us to make a calendar. January had an exam, February a holiday, and the fifth of March a writing competition. In April we would visit a college. May had a science fair on the eighth and a general meeting a week later. June had a concert on the sixteenth. We used different colours for trips in July and August.","The new term began in September. October had a sports day, November a book sale, and December a Christmas celebration. A headmistress checked my dates. I had put a Monday event under Tuesday, a typical mistake. She asked me to leave one weekend free. Otherwise, what would happen to our rest days?"],"id":"read-35","primary":["april","august","celebration","christmas","college","colour","competition","december","eighth","exam","february","fifth","free","general","happen","headmistress","headteacher","january","july","march","miss.","november","october","sale","science","september","sixteenth","term","typical","weekend"],"review":["book","concert","date","june","may"]},
    {"topic":"一周学习计划","title":"Five Days, Five Subjects","paragraphs":["Our English course began with an enjoyable dictation on Monday. On Tuesday we looked up an idiom in a dictionary and learned to spell words from the text. In biology on Wednesday, we examined a leaf. Thursday was physics. A guest physicist let us guess which object would fall first. On Friday a strict headmaster watched our monitor collect the homework.","I had almost forgotten mine. “Do not forget the next essay,” I wrote in my diary. I had an essay, a composition, and a sheet of grammar exercises to finish. I gave each subject an afternoon. By Saturday, I could review my notes and spend Sunday relaxing with a novel. My parents were pleased with my plan."],"id":"read-36","primary":["biology","composition","course","diary","dictation","dictionary","enjoyable","essay","grammar","homework","idiom","leaf","monitor","object","physicist","physics","pleased","relax","review","sheet","strict","subject","sunday","text","thursday","wednesday","tuesday","with"],"review":["english","examine","exercise","finish","forget","friday","headmaster"]},
    {"topic":"小学开放日","title":"What Makes a Helpful Pupil?","paragraphs":["Our school held an open day. A schoolbag full of textbooks sat on a chair beside a blackboard. A group of pupils showed parents how they collect and compare information. In one demonstration, a teacher read a sentence and asked each child to repeat its pronunciation. Another teacher let visitors translate a short dialogue. I watched a pupil with neat handwriting explain a difficult phrase in a normal everyday situation to someone in her class.","Her teacher offered her a word of congratulation for her progress. During P.E., a teenager from a nearby school led an exercise on the playground. A parent asked which skill was most important. The headmaster smiled and said that understanding a question is often more helpful than answering quickly."],"id":"read-37","primary":["congratulation","dialogue","difficult","full","handwriting","helpful","important","information","normal","p.e.","phrase","playground","progress","pronunciation","question","schoolbag","sentence","situation","textbook","translate","understanding","exercise","headmaster","blackboard","smile","class","hold","her"],"review":["chair","everyday","most","neat","often","repeat","teenager"]},
    {"topic":"健康展览","title":"More Than a Poster","paragraphs":["At the health fair, a nurse explained the difference between a common illness and a serious disease such as cancer. A deaf volunteer told us about losing her hearing and showed us how she understood a conversation. An eye doctor asked me to read a chart. A dentist let me hold a model of a tooth and showed me how to use a toothbrush and toothpaste.","I drew a diagram to explain why we should protect our teeth. In another room, a patient described the pain of a stomachache. I felt lucky to learn something I could share at home. A healthy habit can help, but the people at the fair also wanted us to know when to ask for help."],"id":"read-38","primary":["cancer","common","deaf","describe","disease","healthy","hearing","illness","lucky","serious","something","stomachache","tooth","toothbrush","toothpaste","conversation","diagram","eye","habit","health","pain","patient","nurse","chart","understand","know","learn","she"],"review":["difference","such","volunteer","model","protect","should","also"]},
    {"topic":"文物修复","title":"A Palace Made of Clay","paragraphs":["Inside a huge museum, a guide explained why an ancient dynasty built a grand palace beside a river. A painting showed an army with a cannon, a soldier carrying an arrow, and a servant pouring wine. A historian pointed to a monument and explained how a king's tomb was discovered. Another room held a model of a pyramid and a clay dragon.","A painting showed the king in heaven after his death. Perhaps it was a thousand years old. I asked what would be hardest to preserve. A worker said a little dirt could damage a piece of old cloth. Our guide asked us to imagine what people in that century had valued. I chose the smallest vase to draw."],"id":"read-39","primary":["army","arrow","cannon","century","death","dirt","discover","dragon","dynasty","grand","heaven","monument","perhaps","pyramid","servant","thousand","tomb","wine","little","palace","pour","king","painting","imagine","inside","room","people","show"],"review":["cloth","huge","river","soldier","year","piece","point"]},
    {"topic":"报社辩论","title":"A Letter About Clean Air","paragraphs":["At a youth forum, we discussed how a factory might pollute the air and affect the environment. One speaker said the government should set a rule to prevent smoke near schools. A businessman from a federal trade group disagreed and mentioned the cost to his company. A worker argued that health and a safe workplace deserved attention as well. We tried to express each opinion fairly before making a decision.","A local secretary listened and offered to send our suggestions to the mayor. I wrote that a new regulation might work if it could increase demand for cleaner technology and people knew what it meant. The discussion did not end in agreement, but it helped everyone understand why the issue mattered to their families."],"id":"read-40","primary":["businessman","company","demand","discussion","environment","express","federal","government","increase","mention","pollute","prevent","regulation","secretary","smoke","suggestion","workplace","air","attention","deserve","factory","matter","should","trade","family","send","end","but"],"review":["decision","discuss","health","opinion","youth","technology","well"]},
    {"topic":"海边假期","title":"The Tide Was Coming In","paragraphs":["On summer holiday, an office for local tourism sent workers to the beach. A tourist asked where she could rent a canoe. A guide at the beach said boating was safe only inside a marked area. My sister preferred to surf, but the weather forecast called for very strong waves. It was too windy for either activity, so we walked along the shore instead and watched a ship sail toward the port.","A fisherman was repairing his net beside a rock. He told us the rough sea would cover the path before sunset. We turned back in time. At the swimming pool near our hotel, my sister practised how to dive. I sat in the shade with my sunglasses on and watched sunlight fade behind the headland."],"id":"read-41","primary":["along","beach","boating","canoe","dive","either","fisherman","net","port","rent","rough","sail","sea","ship","sunglasses","sunlight","sunset","surf","swimming pool","tourism","tourist","very","windy","holiday","only","too","time","say"],"review":["activity","cover","hotel","prefer","shore","strong","summer"]},
    {"topic":"理发店","title":"The Haircut Before the Photograph","paragraphs":["My sister and I went to a shop downtown for a haircut. I showed the woman my school photo and asked a favour: could she leave the hair above my ears a bit longer? My sister wanted a bright pink ribbon but changed her mind when she saw a red one in a drawer. While we waited, I read a magazine about a famous movie star.","The hairdresser asked which actor I liked best. I said I was more interested in the silly dog beside him. Afterward, my sister combed her hair, put on a pink T-shirt and smiled. I bit my lip to stop laughing. She asked me to take a picture of her. The result was super, much better than our old school photograph."],"id":"read-43","primary":["better","bit","bright","downtown","ear","favour","haircut","lip","magazine","movie","pink","red","silly","super","t-shirt","dog","famous","hair","interest","mind","star","above","best","laugh","photo","woman","change","could"],"review":["drawer","photograph","result","smile","stop","much","long"]},
    {"topic":"听广播","title":"The Same News at Three Speeds","paragraphs":["At 7 a.m. my father turned on the radio for a broadcast. The first channel announced a national holiday. The second interviewed a professor about population growth. On the third, a reporter discussed a recent trade deal between two countries. I seldom listened to the radio, but I was trying to learn English, so my father asked me to write down the main topic in my notebook.","I understood the beginning but could not follow when the presenter spoke quickly. Indeed, the second story was even faster. We played the recording later and paused after each passage. Not every word was necessary to understand the meaning. At 7 o'clock the following evening, I could write a simple summary without replaying the first minute."],"id":"read-44","primary":["a.m.","broadcast","channel","deal","following","indeed","main","meaning","minute","national","necessary","o'clock","passage","population","recent","seldom","discuss","english","evening","pause","present","third","record","even","report","down","without","my"],"review":["beginning","growth","notebook","professor","every","follow","trade"]},
    {"topic":"花草与手工","title":"A Gift That Would Last","paragraphs":["My sister was at an age when she wanted to make everything herself. For Granny's birthday, a kind-hearted gardener showed us how to cut a rose from a plant. We made a basket from bamboo and filled it with flowers. Our niece asked why a bee had picked only one. To her, the flowers looked alike. She wanted to give the bee a gift as well.","At home, we used scissors to cut cloth and made a small doll. I tied a ribbon around its neck and painted a smile on its face. Granny took pride in our work and was grateful for the time we had spent. She liked the basket best and said she would keep it on her desk."],"id":"read-45","primary":["age","alike","bamboo","basket","bee","doll","gift","granny","grateful","kind-hearted","neck","paint","plant","pride","rose","scissors","tie","cloth","everything","fill","garden","herself","flower","well","around","work","its","for"],"review":["face","best","cut","desk","only","pick","home"],"overrides":{"rose":"rose"}},
    {"topic":"早餐店","title":"Something Sour, Something Sweet","paragraphs":["At the market, a cheerful woman let us taste a piece of sour fruit and a sweet banana. She offered us a biscuit, too. We then found a restaurant with porridge, noodles, and a vegetable salad on the menu. My husband ordered mutton and a dish with fresh peas. I chose tomato soup and a slice of bread with cream cheese.","Our daughter was hungry and wanted mild soup to satisfy her hunger. The waiter brought a spoon and a glass of cold water to satisfy her thirst. We had almost finished when the cook had a treat for us: a cookie for each child. I asked for a teapot and poured tea for everyone before paying at the counter."],"id":"read-46","primary":["cookie","cream","daughter","dish","fresh","fruit","hunger","hungry","husband","market","mutton","noodle","pea","porridge","restaurant","sour","spoon","sweet","taste","tea","teapot","tomato","treat","vegetable","finish","almost","let","at"],"review":["banana","cheese","count","glass","menu","mild","pour"]},
    {"topic":"爱好交流会","title":"A Hobby Worth Sharing","paragraphs":["“Hi, I am afraid to talk about my hobby,” said a shy girl. “Maybe I should watch first. I can fly a kite, but my first try was so-so.” I said I used to feel nervous as well. A friendly boy said nothing was too ordinary to share. He liked chess and had brought a secondhand board. Another student wanted to skate or ride a skateboard.","Our coach was confident that anyone could develop an ability with practice. She asked us to accept advice and try again. The girl showed us a kite she had made herself. It looked amazing in the sunshine. She lost the feeling that she was a fool and had the pleasure of showing us how it flew."],"id":"read-47","primary":["ability","accept","amazing","chess","confident","develop","feeling","fly","fool","friendly","hi","hobby","kite","maybe","nervous","nothing","pleasure","secondhand","skate","skateboard","so-so","sunshine","ordinary","practice","lose","girl","boy","it"],"review":["afraid","am","herself","ride","advice","anyone","shy"]},
    {"topic":"城市换乘","title":"The Minibus at the Turning","paragraphs":["A driver with a new license offered to take us across town in a minibus. At the first turning, traffic slowed to walking speed because a lorry had lost a wheel. A policeman waved the cars away from the highway. Our driver said a motorcycle could get past but a jeep would be too wide. He turned south and stopped beside a parking area.","We walked a kilometre to an underground station in the southern part of town, where the elevator was out of order. An elderly lady asked me to carry her suitcase down the steps. A traveler lent her a hand while I bought two tickets. We took a train and reached the hotel before midnight. Outside, a taxi was waiting."],"id":"read-48","primary":["car","elevator","highway","jeep","kilometre","lady","lend","license","minibus","motorcycle","parking","policeman","south","speed","taxi","traffic","underground","hotel","midnight","southern","turning","wheel","order","town","traveler","buy","out","ask"],"review":["step","ticket","train","wide","wave","across","slow"]},
    {"topic":"银行账本","title":"One Penny Missing","paragraphs":["A young businesswoman took a cheque to the bank. She wanted to pay a fee, but the clerk saw that one cent was missing from her total. She offered to add a penny from her purse. The clerk explained that the money was in dollars, so a British pound would cause another problem. They checked a second figure, two million instead of two billion, and corrected it.","A manager let her use a desk and gave her a mobile number to dial if she got into trouble again. She asked if a rise in fees was possible the next month. The probable change was small. By then she was worried that she would miss her meeting. The manager told her to check each large number before signing."],"id":"read-49","primary":["bank","billion","cent","cheque","dial","dollar","million","mobile","penny","possible","pound","probable","trouble","worried","british","fee","manager","purse","total","miss","rise","again","meeting","problem","number","large","young","be"],"review":["cause","month","money","explain","if","into","sign"]},
    {"topic":"节日布置","title":"Lanterns in the Courtyard","paragraphs":["On the eve of Mid-Autumn Festival, a couple helped decorate a courtyard. They hung a lantern above the gate and put a candle on each table. My neighbour brought a mooncake, some chocolate, and a dozen cups. To celebrate, we planned a merry evening of music and dance. Making a wish before lighting the candles was our tradition. A child in a paper hat wanted to know whether the moon was really made of gold.","His sister began a funny tale. “Once upon a time, an angel came to earth.” Later, we rang a bell and welcomed a family who had just moved in. The children were still awake at midnight. They said good-bye with a hug and promised to bring their own festival food to the next party."],"id":"read-50","primary":["angel","awake","bell","candle","celebrate","couple","dance","decorate","dozen","eve","funny","gold","good-bye","hat","hug","merry","mid-autumn","mooncake","party","promise","really","tradition","upon","welcome","festival","ring","they","on"],"review":["chocolate","cup","evening","midnight","moon","once","own"]},
    {"topic":"住店问询","title":"The Key Would Not Turn","paragraphs":["“Excuse me, Madam,” I said. “The lock on my door will not turn.” Mrs. Lu came upstairs with a workman. He asked me not to pull the key. He was sure it might break. I said it was a pity I had not called him sooner. “I suppose I can wait here,” I said. While he inspected the lock, I asked where I could have a bath or a shower.","The manager offered me a comfortable room with a sofa and a larger washroom. I left my umbrella by the door and cleaned a dirty mark from my coat with a towel. I ate supper instead of looking for a room somewhere else. When I returned, the door opened easily."],"id":"read-51","primary":["bath","comfortable","dirty","lock","madam","mrs.","pity","return","shower","sofa","somewhere","soon","suppose","sure","towel","washroom","inspect","key","umbrella","break","coat","eat","else","supper","might","turn","open","i"],"review":["excuse","here","manager","door","upstairs","will","mark"]},
    {"topic":"工厂参观","title":"The Work Behind a Toy","paragraphs":["Our class took a tour of a factory that makes a rubber toy with a tiny motor. A technician showed us how to equip a table with a small press and fasten a wheel to a metal rod. We put a yellow cap on the motor. I was careless and used the wrong type of part, so the toy could not move. An expert helped me inspect it and taught me to operate the machine correctly.","Long shifts can tire workers, so they take breaks. The factory used electricity from a nearby station that burned coal and kept a daily record of each machine itself. We had to obey the safety rules, even for a quick, careful test. By closing time, my toy could carry a small load across the floor without further changes."],"id":"read-53","primary":["cap","careful","careless","coal","daily","electricity","equip","fasten","further","motor","obey","operate","quick","rubber","safety","tire","yellow","burn","close","expert","floor","teach","toy","nearby","long","keep","can","our"],"review":["factory","inspect","itself","machine","metal","press","tour"]},
    {"topic":"荒漠考察","title":"The Sign Beyond the Sand","paragraphs":["A scientific research group crossed a desert in daytime to study a man-made tower. The air was dry and the heat was terrible. It was so hot that thirst became a problem before noon. One traveler saw a cloud of dust in the east and wanted to rush forward, but our guide asked us to remain calm.","We rested in a deep hole in the rock where it was cool and dim. Later, a sudden storm blew sand over a sign and hid the turning. Our guide dug it out with a tool. We were able to continue westwards without getting lost. At camp, I wrote about the strange scenery and my fear of losing the road."],"id":"read-54","primary":["able","blow","cool","daytime","deep","desert","dim","dry","dust","east","fear","hole","man-made","research","rush","sand","scenery","scientific","storm","study","terrible","tool","tower","westwards","thirst","later","about","we"],"review":["air","camp","cloud","continue","cross","dig","heat"]},
    {"topic":"动物救护","title":"Safe Enough to Run Again","paragraphs":["A villager saw an animal moving badly beside a jungle path. It was alive, but it had hurt its front leg in a trap. The villager called for help rather than drag it out by its tail. A doctor examined the wound and said it could survive. The villager had been afraid it was dead. The trap had been set to kill rats, not large animals.","A worker warned that a sudden sound could terrify an animal and make it attack a human. The team stayed quiet and took care. They let it go later in a protected area. For a moment we could see the thick fur on its back. It ran into the grass and disappeared before I could take a picture."],"id":"read-55","primary":["alive","attack","badly","dead","disappear","drag","fur","human","jungle","kill","rat","tail","terrify","trap","villager","wound","afraid","examine","front","animal","doctor","grass","protect","set","path","into","back","have"],"review":["care","leg","moment","rather","run","sudden","sound"]},
    {"topic":"互助花园","title":"What the Neighbours Built","paragraphs":["A local foundation helped found our neighbourhood garden. An older generation wanted a natural place for people who felt lonely. A generous woman let us dig part of her land. A hardworking neighbour climbed a ladder and hung a sign at the top of a gate beside the fountain. Visitors could enjoy the flowers, fill a bottle, or feed a pet.","Some were fond of the quiet, but others wanted more people to visit. A teenager asked what the garden could provide in the future. We agreed to allow more events and keep one corner for anyone who wanted peace. People gradually got into a routine. I felt real satisfaction when I saw my neighbours talking there."],"id":"read-56","primary":["allow","enjoy","fond","found","foundation","fountain","future","generation","generous","gradually","hardworking","ladder","lonely","natural","peace","pet","provide","satisfaction","top","dig","feed","teenager","visit","agree","event","visitor","there","in"],"review":["climb","corner","fill","garden","land","neighbourhood","neighbour"],"overrides":{"found":"found"}},
    {"topic":"饮食小摊","title":"The Best Thing at the Stall","paragraphs":["At the fair, a woman sold ice-cream, banana bread, and toast with jam. She also offered juice, Coke, and cocoa. A drunk customer asked for more beer, but she said no. My uncle was driving, so he chose water. I wanted to eat everything, although I could not afford it all. My friend chose turkey and a salad.","I bought chocolate and kept the rest of my money. Two children ate noisily beside us. One put hot jam on his tongue and had to spit it out. A cat sat under the table and waited for meat. The seller told us not to feed it. We agreed that the toast was the cheapest thing there and also the most delicious."],"id":"read-57","primary":["afford","although","beer","cat","coke","delicious","drunk","ice-cream","jam","juice","meat","noisily","spit","tongue","turkey","banana","cheap","chocolate","cocoa","customer","hot","most","salad","also","friend","more","wait","of"],"review":["everything","feed","sell","uncle","bread","eat","no."]},
    {"topic":"大学开放日","title":"An Idea That Worked Eventually","paragraphs":["At the university, an inventor showed us her first invention. It let a student turn a page with one finger. She had tried several designs, and none had worked. The successful version looked easy to use, but making it had been tough. A student asked how she had managed to succeed. She said discovery in technology can start with a difficulty in everyday life.","Her professor had encouraged her to focus on a real problem instead of looking for fame. She let us try the device and asked what we would invent for our classrooms. I learned how the brain can solve a problem by trying different approaches, and why an idea with potential often needs time."],"id":"read-58","primary":["brain","difficulty","discovery","easy","fame","finger","focus","invent","invention","inventor","none","potential","succeed","successful","tough","university","classroom","everyday","often","professor","several","real","technology","idea","need","student","try","and"],"review":["encourage","life","manage","page","problem","different","turn"]},
    {"topic":"社区辩论队","title":"A Fairer Rule","paragraphs":["In our debate club, one student said it was unfair to make everyone pay the same fee. Another said equality meant giving each family an equal chance to join. We were certain a change could not satisfy everyone. We compared ideas and asked a member of a public society for advice. A visitor from the province said there was no perfect rule.","Changes in law or politics could help, but people had a duty to listen. We could state our opinions and regard people as equals without insisting on one answer. At the end, we wrote a polite reply to families who had complained. We wanted the next group to understand what our decision would mean in practice."],"id":"read-59","primary":["certain","chance","duty","equality","insist","law","polite","politics","public","regard","society","state","unfair","decision","equal","opinion","province","reply","same","satisfy","advice","join","no","everyone","club","pay","give","to"],"review":["complain","fee","member","idea","mean","practice","rule"]},
    {"topic":"纪念馆回信","title":"A Different Kind of Hero","paragraphs":["A guide at a war memorial showed us a school report written by a soldier long ago. He left his homeland to fight an unknown enemy. There was one letter that read, “Dear comrade, I hope this message reaches you.” Below it, a nurse wrote that a wounded stranger might die without water. She offered water without asking about his side.","The guide said these small acts deserved to be remembered. I used to believe a hero had to win a great battle. That afternoon, I wondered if courage could also mean helping a person you had been taught to hate. The guide thought those acts were a kind of brotherhood. I wrote that down and thought about the world we live in."],"id":"read-60","primary":["act","ago","below","brotherhood","comrade","dear","die","enemy","fight","great","hate","hero","homeland","kind","war","win","wonder","world","wounded","live","soldier","strange","hope","mean","think","reach","leave","a"],"review":["believe","deserve","message","teach","these","those","unknown"]},
    {"topic":"城市电影节","title":"The Film That Made Us Stay","paragraphs":["Our cinema held a festival for short films. The first was an action story set in the Pacific. A captain let a passenger onto his boat. The man turned out to be a thief who tried to steal food and rob another traveler. A shot rang out and the victim told the truth about a murder. We also saw a short opera set in a night-club.","Unlike the first film, it sounded boring, but the ending brought a tear to my eye. A fan asked how much it cost to shoot a film in foggy London. The director said it would depend on the story. Filming a crash can be expensive, but a single camera can make a beautiful film. The festival was a success."],"id":"read-61","primary":["action","beautiful","boat","boring","captain","cinema","crash","depend","expensive","film","foggy","london","murder","night-club","opera","pacific","rob","shoot","shot","single","steal","success","tear","thief","unlike","victim","bring","the"],"review":["director","eye","fan","festival","onto","passenger","ring"]},
    {"topic":"时间胶囊","title":"The Sixteenth Drawer","paragraphs":["On the twentieth of June, our class opened a time capsule that students had buried fifty years before. Each drawer belonged to somebody. No. 9 held a report from a ninth-grade pupil. It said she hoped to graduate at nineteen and become a teacher. She called it her dream. No. 16 belonged to a boy who wanted to learn forty songs on the guitar. No. 17 held seventeen photos, and the last photo showed his seventh birthday.","The twelfth drawer contained twelve stamps and a note about a trip on the twenty-first of May, twenty years after our first trip. A child listening to us asked why anyone would keep such ordinary things. I said the things helped us imagine what had mattered to their owners. Seven stamps came from abroad."],"id":"read-62","primary":["bury","dream","fifty","forty","graduate","guitar","nineteen","seven","seventeen","twelfth","twelve","twentieth","twenty","twenty-first","june","may","note","seventh","somebody","such","anyone","birthday","trip","owner","thing","listen","teacher"],"review":["abroad","stamp","hope","song","photo","pupil","report","become"]},
    {"topic":"广播天气","title":"The Warmest Afternoon","paragraphs":["At ten today, the TV station asked a girl to read the weather. The capital would be sunny with a high of thirty degrees. The northern valley would reach thirteen. Neither the coast nor the southern valley would stay warm tonight. Things could get worse. On a windy day the presenter usually tested the screen. This time it showed zero, though she knew the usual reading was much higher.","A sudden change can strike a station in the middle of a show. Her producer gave her a new chart. It showed sixteen in the southeast and fourteen in the southwest. Yesterday it had felt like mild spring weather, but now she needed a coat to go outside."],"id":"read-63","primary":["fourteen","nor","northern","sixteen","southeast","southwest","strike","sunny","ten","thirteen","thirty","though","tonight","tv","usual","usually","worse","yesterday","zero","high","mild","spring","sudden","screen","much","outside","feel"],"review":["capital","middle","neither","present","produce","southern","today","windy"]},
    {"topic":"家庭分工","title":"Our Turn to Do the Housework","paragraphs":["When I was a kid, I used to tell myself that housework was a job for a housewife. My brother and I changed our minds when our parents gave us the housework, which had piled up since Monday. He likes cooking, so on a weekday he can put supper on the table, but I must tidy the living room and wash the floor. At first I was lazy and waited till late.","Then my younger twin cousins came over. “Mommy, is this ours or theirs?” one asked, holding up a stocking. I told them, “Check for names yourselves.” They found their own things and dressed themselves. We had left clothes everywhere. I made a simple list of what to do and pinned it beside the toilet."],"id":"read-64","primary":["everywhere","housewife","housework","job","kid","lazy","living","mommy","must","myself","ours","since","stocking","theirs","themselves","tidy","till","toilet","twin","weekday","yourselves","own","monday","parent","simple","is","like"],"review":["clothes","floor","mind","dress","supper","cook","cousin","pile"]},
    {"topic":"球场友谊","title":"An Apology on the Way Home","paragraphs":["I got angry when my friend hit the ball into the street. I called the move stupid and quit after a quarrel. At home I felt awful. I had been rude and would lose her friendship if I did not tell her the truth. The thought made me want to be honest rather than lie. I wrote an apology. “I'm sorry I shouted.”","“I regret giving you the worst part of my day.” Her call brought me comfort. She said we could play again tomorrow. I was glad to hear her voice. We had been so busy trying to beat each other that we forgot the game was for fun. I hope that is still true next week. I will remember it whenever we play."],"id":"read-65","primary":["angry","apology","awful","beat","comfort","friendship","fun","hit","honest","lie","quarrel","quit","regret","rude","shout","sorry","stupid","thought","tomorrow","true","voice","whenever","worst","forget","truth","day","move"],"review":["busy","game","glad","hear","street","week","remember","lose"],"overrides":{"thought":"thought"}},
    {"topic":"清晨山路","title":"The Best Spot for a Picnic","paragraphs":["Our aunt took us to a mountain park in the west. The morning mist was heavy, but we could still climb slowly. A guide showed us a picnic spot. “Whichever path you take,” she said, “remember to wear boots and bring enough water.” My sister was already thirsty. I passed her a bottle and we sat on a stone.","A father with a tall son stopped to ask how far we had come. We told him he could rest wherever he found a rock. At last the clouds lifted and we saw a splendid view of the land. We ate under a tree and told each other riddles. Our picnic was simple, but it was my favourite part of the holiday."],"id":"read-66","primary":["already","far","favourite","heavy","mist","park","picnic","riddle","son","splendid","spot","stone","tall","thirsty","wear","wherever","whichever","boot","climb","cloud","land","west","father","remember","stop","sister","come"],"review":["lift","mountain","tree","pass","holiday","morning","rock","path"]},
    {"topic":"古城导览","title":"A Kingdom's Old Capital","paragraphs":["A guide led us through the capital of an old kingdom. A painting showed the king in a long suit, standing among his people. The man beside him was a pioneer who had opened a safer route during a boom in trade across the mountains. Because he was born in a poor village, nobody thought he would attend the king's court. One story says he came forth to tell the king about a danger in the west.","The king listened and agreed to prepare a supply of food for the valley. Our guide said the actual event was probably less dramatic. However, people admired him for protecting towns a flood had almost destroyed. A painter who lived near an old church in the province had made several works about his journey."],"id":"read-67","primary":["boom","born","church","destroy","forth","however","journey","kingdom","less","pioneer","poor","prepare","probably","suit","supply","works","among","attend","capital","mountain","painter","village","during","food","story","old","near"],"review":["flood","live","province","several","west","king","lead","man"]},
    {"topic":"理想学校","title":"A Class Without a Bell","paragraphs":["An education expert asked us to imagine a modern school where students could work anywhere. Somebody suggested an internet class with no grades. Another said it was impossible to learn a foreign language entirely by oneself. A teacher said students could attend online unless they needed special equipment. Online lessons could exist alongside meetings with a teacher, especially for speaking practice.","We decided to introduce one day each week when everybody could choose how to learn. The advice we received was to include teamwork, or a good idea might prove useless. Thus, we had an excellent example of how a new school might work. Our teacher asked us to explain exactly which part we liked best and why."],"id":"read-68","primary":["anywhere","education","especially","everybody","exactly","example","excellent","exist","foreign","grade","impossible","internet","introduce","language","modern","oneself","receive","special","teamwork","thus","unless","useless","week","lesson","part","explain","new"],"review":["attend","equipment","expert","include","somebody","suggest","decide","meeting"]},
    {"topic":"电台访问","title":"Whose Umbrella Is This?","paragraphs":["“Hey, whose umbrella is this?” asked the host of a radio quiz. A caller said it was hers. “Pardon? Did you say it's yours?” he asked. A second caller said, “Neither. The blue one is mine. This one belongs to our class.” The host asked how she knew. “We wrote our name on it ourselves,” she said. A boy at the station found the label.","“Oh, it's nice to know your class still has it.” “Anyhow, you can come collect it,” the host said. “OK, shall we come today?” a caller asked. “Yes,” said the host. “You can ask the teacher yourself,” the girl replied. “She is right here.” They decided to come in after the show."],"id":"read-70","primary":["anyhow","hers","hey","nice","oh","ok","ourselves","pardon","quiz","shall","whose","yes","your","yours","yourself","here","mine","neither","today","decide","blue","collect","radio","this","station","name","find"],"review":["reply","umbrella","you","girl","know","class","is","still"]},
    {"topic":"城市科技节","title":"Five Teams and a Quiet Robot","paragraphs":["Our technology fair opened at nine. We watched five teams compete for a place in the final. Team No. 80 had built a robot that could knock on a door. Team No. 90 used a small fan to make a paper flag swing. The sixth group could not get their robot to move, and the seventh had a problem with the power unit. I helped the ninth team read an instruction on its screen.","I learned how to instruct a group without taking over. A judge said the point was to learn how to connect one idea to another. At noon, sixty visitors had voted with a tick beside a name. By the end, seventy more had given us praise and feedback. We wrote a list of what to try next."],"id":"read-73","primary":["connect","five","instruct","instruction","judge","knock","nine","ninth","praise","seventy","sixth","sixty","swing","tick","unit","fan","flag","robot","build","final","list","no.","noon","team","over","get","watch"],"review":["seventh","paper","name","visitor","group","more","place","read"]},
    {"topic":"家庭旧照片","title":"The Necktie in the Photograph","paragraphs":["“Goodness, I had forgotten this,” said Grandpa when he found a photograph of the day my grandparents decided to marry. Grandma had bought a pretty blue dress, and Grandpa had worn his father's necktie. Their granddaughter asked why nobody in the picture looked happy. Grandpa said the camera was slow and nobody dared move. A second photograph showed him holding her mother on his lap.","Her father stood beside them with a lovely smile. We were thankful to have these pictures. Grandma said the way people dress changes, but kindness and a good joke can make life wonderful. A photograph can last a lifetime. At the end, I wrote down what she had said. It was a personal memory I wanted to keep, and she was glad I had asked."],"id":"read-74","primary":["goodness","granddaughter","happy","joke","lap","lifetime","lovely","marry","memory","necktie","personal","pretty","thankful","dare","glad","life","these","wonderful","camera","dress","good","grandma","grandpa","mother","way","picture","what"],"review":["father","nobody","this","buy","down","day","keep","their"]},
    {"topic":"展馆公共安全","title":"The Door at the Back","paragraphs":["A guard gave us an early tour of a building used for meetings at the U.N. He asked us to look at the entry permit and check the number on it. A woman asked whether the other door was an escape route. The guard gave her a direct answer. He said it was, and told us what to do if there was a fire or an earthquake.","We put our bags in a safe place and went upstairs. A group from a European nation had arrived, and the hall became noisy. A young visitor said, “Please show us where we can sit.” The guard pointed to a quiet corner. We watched people from different countries talk about issues that could not be solved by one nation alone."],"id":"read-75","primary":["alone","building","direct","early","earthquake","entry","escape","european","fire","nation","permit","please","u.n.","corner","noisy","tour","door","hall","talk","upstairs","answer","arrive","whether","country","safe","if","or"],"review":["number","quiet","woman","do","go","sit","there","where"]},
    {"topic":"水上训练","title":"First Visit to the Swimming Club","paragraphs":["I went to a swimming lesson in the middle of the summer season. Some children looked ready to jump in, at least from the edge of the pool. I had a painful leg and did not dare follow them. The teacher asked me to sit beside her and dip a foot in first. The water felt cold, but the light began to shine on it and I could see the bottom.","A boy's noisy jump frightened a child. “Whatever you do, never push,” the teacher said. Our teacher shut the gate and paused the lesson to explain the rule. When the lesson ended, my leg still hurt. I was hopeful that I could come back. It had seemed hopeless at first, but I had learned to ask for help without worrying they would laugh."],"id":"read-77","primary":["bottom","dip","frighten","hopeful","hopeless","jump","least","painful","ready","season","seem","shine","shut","swimming","whatever","worry","edge","leg","middle","push","summer","hurt","cold","rule","some","begin","first"],"review":["dare","foot","never","noisy","pause","pool","light","laugh"]},
    {"topic":"等一封信","title":"News from Somewhere New","paragraphs":["I wrote to a girl who moved from the mainland to an island. She said the hardest thing was not knowing anybody at first. The ocean looked wonderful, but she said, “Nowhere feels like home lately.” Sometimes she walked a mile just to sit on a rock and think. I asked if she had found a type of music she liked there.","She sent me a popular pop song from her school. “I used to envy my older sister,” she wrote, “because she could make friends so fast, while I almost always felt shy. But I am not sad all the time now, and I think the change will last.” I played her song twice and wrote back to say I believed her. I wished her luck."],"id":"read-80","primary":["envy","island","lately","luck","mainland","mile","nowhere","ocean","pop","sad","sometimes","am","believe","popular","twice","type","wish","all","fast","hard","now","shy","will","rock","walk","play","who"],"review":["wonderful","music","always","just","think","because","thing","send"]}

  <script>
    const previousLessons = [
      {

        },

      },
      {
        id: "juice", topic: "果汁", title: "A Drink for Lunch", frequency: 3,

          "fruit juice": ["果汁"],

          pour: ["倒；倾倒（液体）", "poured"],

        },
        paragraphs: [
          "Mina wanted to serve fruit juice at a school lunch. She cut a fresh orange in half and squeezed it into a bowl. When she tasted the fruit juice, it made her eyes close. Her friend Dan reached for the sugar. Mina asked him to wait.",
          "She cut up a sweeter orange and poured its juice into the bowl. The taste was better, but Dan still wanted to add sugar. They poured a little into two cups, added a spoonful of sugar to the second cup, and asked their teacher to taste both.",
