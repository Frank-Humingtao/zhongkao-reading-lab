<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>生词看板</title>
  <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131518" media="(prefers-color-scheme: dark)">
  <script id="theme-settings">
    const themeStorageKey = "zhongkao-reading-theme";
    const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
    let preferredTheme;
    try {
      preferredTheme = localStorage.getItem(themeStorageKey);
    } catch {
      // The system preference still applies if local storage is unavailable.
    }

    function updateTheme() {
      const dark = preferredTheme === "dark" || (preferredTheme !== "light" && systemTheme.matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      const toggle = document.getElementById("dark-mode");
      if (toggle) {
        toggle.setAttribute("aria-pressed", dark);
        toggle.setAttribute("aria-label", dark ? "切换到浅色" : "切换到深色");
      }
    }

    updateTheme();
    systemTheme.addEventListener("change", updateTheme);
  </script>
  <style>
    @font-face {
      font-family: "Huiwen Zhengkai";
      src: url("huiwen-zhengkai.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      unicode-range: U+2014, U+2018-2019, U+201C-201D, U+2026, U+3000-303F, U+3100-312F, U+31A0-31BF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF, U+20000-323AF;
    }

    /* ---------- Tokens ---------- */
    :root {
      color-scheme: light;
      --bg: #f5f3ee;
      --raised: #fffdf9;
      --ink: #23262b;
      --ink-2: #4b5058;
      --muted: #8a8d93;
      --hair: #e7e3da;
      --fill: #ebe7de;
      --fill-hover: #e2ddd2;
      --accent: #b42a2a;
      --accent-soft: #f6e1dc;
      --ok: #3f7d5c;
      --solid: #23262b;
      --on-solid: #fffdf9;
      --scrim: #1d1f2266;
      --chinese: "Huiwen Zhengkai", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
      --english: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --gutter: clamp(18px, 5vw, 32px);
      font-family: var(--chinese);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #131518;
      --raised: #1b1e22;
      --ink: #ece8e1;
      --ink-2: #c3beb5;
      --muted: #8c9097;
      --hair: #272b30;
      --fill: #24282d;
      --fill-hover: #2d3238;
      --accent: #f08c84;
      --accent-soft: #3b2427;
      --ok: #8cc7a6;
      --solid: #ece8e1;
      --on-solid: #131518;
      --scrim: #000a;
    }

    /* ---------- Base ---------- */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-size: 17px; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, p, ul { margin: 0; }
    h1, h2, h3 { font-weight: normal; }
    ul { padding: 0; list-style: none; }
    a { color: inherit; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    .icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

    .page {
      max-width: 720px; margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) var(--gutter) calc(64px + env(safe-area-inset-bottom));
    }

    /* ---------- Top bar ---------- */
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; }
    .site-nav { display: flex; gap: 2px; min-width: 0; overflow-x: auto; scrollbar-width: none; margin-left: -9px; }
    .site-nav::-webkit-scrollbar { display: none; }
    .site-nav a {
      flex: none; padding: 6px 9px; border-radius: 999px; text-decoration: none;
      color: var(--muted); font-size: .88rem; white-space: nowrap;
    }
    .site-nav a:hover { color: var(--ink); }
    .site-nav a[aria-current="page"] { background: var(--fill); color: var(--ink); }
    .tools { display: flex; flex: none; margin-right: -6px; }
    .icon-button {
      position: relative; display: grid; place-items: center;
      width: 38px; height: 38px; border-radius: 999px; color: var(--ink-2);
    }
    .icon-button:hover { background: var(--fill); color: var(--ink); }
    .sync-dot {
      position: absolute; top: 9px; right: 8px; width: 7px; height: 7px; border-radius: 50%;
      background: var(--ok); box-shadow: 0 0 0 2px var(--bg);
    }
    .theme-sun { display: none; }
    :root[data-theme="dark"] .theme-sun { display: block; }
    :root[data-theme="dark"] .theme-moon { display: none; }

    /* ---------- Summary ---------- */
    .summary { padding: 28px 0 22px; }
    .total { display: flex; align-items: baseline; gap: 10px; }
    .total-number {
      font-family: var(--english); font-size: clamp(3rem, 14vw, 4.2rem); line-height: 1;
      font-variant-numeric: lining-nums tabular-nums; letter-spacing: -.02em;
    }
    .total-unit { color: var(--ink-2); font-size: 1.05rem; }
    .status { margin-top: 10px; color: var(--muted); font-size: .88rem; }
    .status:empty { display: none; }

    .notice {
      margin-bottom: 20px; padding: 12px 16px; border-radius: 14px;
      background: var(--accent-soft); color: var(--accent); font-size: .92rem;
    }
    .notice a { margin-left: .5em; }

    /* ---------- Day picker ---------- */
    .day-picker {
      position: sticky; top: 0; z-index: 3;
      display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
      margin-inline: calc(-1 * var(--gutter)); padding: 10px var(--gutter);
      background: var(--bg);
    }
    .day-picker::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; display: inline-flex; align-items: baseline; gap: 6px;
      padding: 7px 14px; border-radius: 999px; background: var(--fill);
      color: var(--ink-2); font-size: .92rem; white-space: nowrap;
    }
    .chip:hover { background: var(--fill-hover); }
    .chip small { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
    .chip[aria-pressed="true"] { background: var(--solid); color: var(--on-solid); }
    .chip[aria-pressed="true"] small { color: inherit; opacity: .7; }

    /* ---------- Days ---------- */
    .day { padding-top: 28px; }
    .day + .day { margin-top: 20px; }
    .day-head { display: flex; align-items: center; gap: 12px; padding-bottom: 6px; }
    .day-title { font-size: 1.3rem; }
    .day-title .weekday { color: var(--muted); font-size: .95rem; margin-left: 8px; }
    .day-count { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
    .copy {
      margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 12px; border-radius: 999px; color: var(--ink-2); font-size: .9rem;
    }
    .copy:hover { background: var(--fill); color: var(--ink); }
    .copy[data-done] { color: var(--ok); }
    .copy .icon { width: 17px; height: 17px; }
    .copy-fallback {
      width: 100%; min-height: 6rem; margin: 6px 0 4px; padding: 12px 14px; border: 0; border-radius: 12px;
      background: var(--fill); color: var(--ink); font: 1rem/1.5 var(--english); resize: vertical;
    }

    /* ---------- Word entries ---------- */
    .entry { padding: 22px 0 24px; }
    .entry + .entry { box-shadow: inset 0 1px var(--hair); }
    .entry-head { display: flex; align-items: flex-start; gap: 12px; }
    .entry-word { flex: 1; min-width: 0; }
    .term {
      display: block; font-family: var(--english); font-size: 1.6rem; line-height: 1.2;
      color: var(--accent); overflow-wrap: anywhere;
    }
    .meaning { margin-top: 6px; color: var(--ink); font-size: 1.02rem; }
    .meaning:empty { display: none; }
    .speak {
      flex: none; display: grid; place-items: center; width: 42px; height: 42px; margin-top: -2px;
      border-radius: 999px; background: var(--fill); color: var(--ink-2);
    }
    .speak:hover { background: var(--fill-hover); color: var(--ink); }
    .speak.speaking { background: var(--accent-soft); color: var(--accent); }
    .speak-status { margin-top: 6px; color: var(--muted); font-size: .85rem; }
    .speak-status:empty { display: none; }

    .uses { margin-top: 16px; display: grid; gap: 16px; }
    .use { padding-left: 14px; position: relative; }
    .use::before {
      content: ""; position: absolute; left: 0; top: .45em; bottom: .3em; width: 2px;
      border-radius: 2px; background: var(--hair);
    }
    .use-source { color: var(--muted); font-size: .8rem; letter-spacing: .02em; }
    .use-source .lesson { font-family: var(--english); font-style: italic; letter-spacing: 0; }
    .use-meaning { margin-top: 2px; color: var(--ink-2); font-size: .92rem; }
    .example { margin-top: 4px; font: 1.08rem/1.6 var(--english); color: var(--ink); }
    .example mark { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 .12em; }
    .translation { margin-top: 4px; color: var(--ink-2); font-size: .94rem; line-height: 1.65; }

    /* ---------- Empty ---------- */
    .empty { padding: 56px 0 24px; text-align: center; color: var(--muted); }
    .empty-title { color: var(--ink); font-size: 1.15rem; }
    .empty p + p { margin-top: 8px; font-size: .93rem; }
    .empty a { color: var(--ink-2); }

    /* ---------- Sync sheet ---------- */
    .sheet {
      width: min(28rem, calc(100% - 32px)); max-height: calc(100% - 32px);
      padding: 24px; border: 0; border-radius: 22px;
      background: var(--raised); color: var(--ink);
      box-shadow: 0 24px 60px #0003;
    }
    .sheet::backdrop { background: var(--scrim); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; }
    .sheet-head h2 { font-size: 1.2rem; }
    .sheet-head .icon-button { margin-right: -10px; }
    .sheet-body { display: grid; gap: 14px; margin-top: 14px; }
    .sheet-note { color: var(--ink-2); font-size: .92rem; }
    .sheet-note a { color: var(--ink); }
    .field {
      width: 100%; padding: 12px 14px; border: 0; border-radius: 12px;
      background: var(--fill); color: var(--ink); font: 1rem/1.4 ui-monospace, Menlo, monospace;
    }
    .check-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .check-row a { color: var(--ink-2); font-size: .92rem; }
    .check { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: .92rem; }
    .check input { width: 18px; height: 18px; accent-color: var(--solid); }
    .buttons { display: flex; gap: 10px; flex-wrap: wrap; }
    .button {
      flex: 1; min-height: 46px; padding: 0 18px; border-radius: 999px;
      background: var(--fill); color: var(--ink); font-size: .98rem;
    }
    .button:hover { background: var(--fill-hover); }
    .button.solid { background: var(--solid); color: var(--on-solid); }
    .button.solid:hover { opacity: .9; }
    .sheet-status { color: var(--ink-2); font-size: .9rem; }
    .sheet-status:empty { display: none; }

    @media (max-width: 560px) {
      body { font-size: 16px; }
      .summary { padding-top: 28px; }
      .term { font-size: 1.45rem; }
      .sheet {
        width: 100%; max-width: none; margin: auto 0 0; border-radius: 22px 22px 0 0;
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .chip, .icon-button, .speak, .copy, .button { transition: background-color .15s, color .15s; }
      .sheet[open] { animation: rise .22s ease-out; }
      @keyframes rise { from { transform: translateY(16px); } }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.6 4.5 4.5 0 0 0 7 18.5Z"/></symbol>
    <symbol id="i-speak" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5Z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M15.5 8.5V6A1.5 1.5 0 0 0 14 4.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  </svg>

  <div class="page">
    <header class="topbar">
      <nav class="site-nav" aria-label="阅读资料">
        <a href="./">筛选短文</a>
        <a href="./?set=reading-01">01</a>
        <a href="./?set=reading-02">02</a>
        <a href="./?set=reading-03">03</a>
        <a href="./vocab.html" aria-current="page">生词</a>
      </nav>
      <div class="tools">
        <button type="button" class="icon-button" id="dark-mode" aria-pressed="false" aria-label="切换到深色">
          <svg class="icon theme-moon" aria-hidden="true"><use href="#i-moon"/></svg>
          <svg class="icon theme-sun" aria-hidden="true"><use href="#i-sun"/></svg>
        </button>
        <button type="button" class="icon-button" id="open-sync" aria-haspopup="dialog" aria-label="GitHub 同步">
          <svg class="icon" aria-hidden="true"><use href="#i-cloud"/></svg>
          <span class="sync-dot" id="sync-dot" hidden></span>
        </button>
      </div>
    </header>

    <section class="summary" aria-labelledby="board-title">
      <h1 class="visually-hidden" id="board-title">生词看板</h1>
      <p class="total"><span class="total-number" id="word-count">0</span><span class="total-unit">个生词</span></p>
      <p class="status" id="board-status" role="status"></p>
    </section>

    <main>
      <p class="notice" id="demo-banner" hidden>这是示例数据，不是你的生词。<a href="vocab.html">返回我的生词</a></p>
      <div class="day-picker" id="day-picker" role="toolbar" aria-label="按日期查看" hidden></div>
      <div class="empty" id="empty-note" hidden>
        <p class="empty-title" id="empty-text"></p>
        <p id="demo-entry"><a href="vocab.html?demo=1">看看示例</a></p>
      </div>
      <div id="day-list"></div>
    </main>
  </div>

  <dialog class="sheet" id="sync-dialog" aria-labelledby="sync-heading">
    <div class="sheet-head">
      <h2 id="sync-heading">GitHub 同步</h2>
      <button type="button" class="icon-button" id="close-sync" aria-label="关闭">
        <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>
    <form class="sheet-body" id="sync-form">
      <input class="field" id="sync-token" type="password" aria-label="GitHub 同步令牌" placeholder="github_pat_…" autocomplete="off" spellcheck="false" required>
      <div class="check-row">
        <label class="check"><input id="remember-sync" type="checkbox"> 记住令牌</label>
        <a href="https://github.com/settings/personal-access-tokens/new?name=Zhongkao+Reading+Lab&amp;target_name=Frank-Humingtao&amp;contents=write" target="_blank" rel="noopener noreferrer">创建令牌</a>
      </div>
      <div class="buttons"><button type="submit" class="button solid">连接并同步</button></div>
    </form>
    <div class="sheet-body" id="sync-actions" hidden>
      <div class="buttons">
        <button type="button" class="button solid" id="sync-now">立即同步</button>
        <button type="button" class="button" id="disconnect-sync">断开</button>
      </div>
    </div>
    <p class="sheet-status" id="sync-status" role="status"></p>
  </dialog>

  <script>
    document.getElementById("dark-mode").addEventListener("click", () => {
      preferredTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      updateTheme();
      try {
        localStorage.setItem(themeStorageKey, preferredTheme);
      } catch {
        // Keep the selected theme for the current page.
      }
    });
    updateTheme();
  </script>
  <script type="module" src="vocab-board.js"></script>
</body>
</html>
