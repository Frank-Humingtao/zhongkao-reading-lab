<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生词看板</title>
  <script id="theme-settings">
    const themeStorageKey = "zhongkao-reading-theme";
    const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
    let preferredTheme;
    try {
      preferredTheme = localStorage.getItem(themeStorageKey);
    } catch {
      // The system preference still applies if local storage is unavailable.
    }

    function updateTheme() {
      const dark = preferredTheme === "dark" || (preferredTheme !== "light" && systemTheme.matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.getElementById("dark-mode")?.setAttribute("aria-pressed", dark);
    }

    updateTheme();
    systemTheme.addEventListener("change", updateTheme);
  </script>
  <style>
    @font-face {
      font-family: "Huiwen Zhengkai";
      src: url("huiwen-zhengkai.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      unicode-range: U+2014, U+2018-2019, U+201C-201D, U+2026, U+3000-303F, U+3100-312F, U+31A0-31BF, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF, U+FF00-FFEF, U+20000-323AF;
    }
    :root {
      color-scheme: light;
      --background: #edf2f7;
      --paper: #fff;
      --ink: #1e2e41;
      --muted: #506377;
      --control-fill: #e0e8f1;
      --blue: #244d76;
      --blue-soft: #e7f0fa;
      --primary: #244d76;
      --primary-hover: #183a5b;
      --red: #a52738;
      --red-soft: #ffeaed;
      --overlay-shadow: #142f4b24;
      --chinese-font: "Huiwen Zhengkai", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
      font-family: var(--chinese-font);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #131922;
      --paper: #1d2734;
      --ink: #e3eaf2;
      --muted: #abbacf;
      --control-fill: #293749;
      --blue: #adcdf8;
      --blue-soft: #30445f;
      --primary: #345c85;
      --primary-hover: #406b97;
      --red: #ffb0bc;
      --red-soft: #512c38;
      --overlay-shadow: #0007;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--background); color: var(--ink); }
    button, a.action { font: inherit; color: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    .shell { max-width: 1420px; margin: 0 auto; padding: 32px clamp(16px, 2.6vw, 36px) 56px; }
    .masthead { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { font-weight: normal; }
    h1 { font-size: clamp(1.55rem, 4vw, 2.1rem); }
    h2 { font-size: 1.65rem; }
    a.action { display: inline-block; text-decoration: none; }
    .action {
      border: 0; border-radius: 8px;
      background: var(--control-fill); padding: 10px 15px; font-size: .9rem;
    }
    .action:hover { background: var(--blue-soft); }
    .primary { background: var(--primary); color: white; }
    .primary:hover { background: var(--primary-hover); }
    .theme-toggle[aria-pressed="true"] { background: var(--blue-soft); color: var(--blue); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .reading-materials { margin-top: 18px; }
    .reading-materials summary { width: fit-content; padding-block: 4px; cursor: pointer; }
    .reading-materials ul { display: grid; gap: 4px; margin: 6px 0 0; padding-inline-start: 1.25rem; }
    .reading-materials a { color: var(--blue); text-underline-offset: .18em; }
    .reading-materials a[aria-current="page"] { color: var(--ink); font-weight: 600; }
    .feedback { margin-top: 10px; color: var(--blue); font-size: .88rem; line-height: 1.6; }
    .feedback:empty { display: none; }
    .surface {
      background: var(--paper);
      padding: clamp(18px, 3vw, 40px); min-width: 0; margin-top: 24px;
    }
    .count-line { display: flex; align-items: baseline; gap: 12px; }
    .count { color: var(--blue); font-size: 1.65rem; font-variant-numeric: tabular-nums; }
    .empty {
      display: grid; gap: 8px;
      font-size: .93rem; padding: 19px 14px; background: var(--background);
      border-radius: 7px; margin-top: 18px; color: var(--muted);
    }
    .demo-entry { color: var(--blue); width: fit-content; }
    .demo-banner {
      margin-bottom: 18px; padding: 12px 14px; border-radius: 7px;
      background: var(--red-soft); color: var(--red); font-size: .95rem; line-height: 1.6;
    }
    .demo-banner a { color: var(--blue); margin-left: .6em; }
    .daily { margin-top: 32px; }
    .day-block + .day-block { margin-top: 22px; }
    .day-block h3 { margin-top: 0; color: var(--blue); font-size: 1.05rem; }
    .day-count { color: var(--muted); font-size: .84rem; margin-left: 8px; }
    .word-list { list-style: none; margin: 12px 0 0; padding: 0; }
    .word-list li {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline;
      gap: 2px 16px; padding: 8px 0;
    }
    .term { color: var(--red); font-weight: 700; }
    .sources { color: var(--muted); font-size: .86rem; }
    .sync-dialog {
      width: min(29rem, calc(100% - 28px)); padding: 20px; border: 0;
      border-radius: 12px; background: var(--paper); color: var(--ink);
    }
    .sync-dialog::backdrop { background: #13192299; }
    .sync-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .sync-head h2 { font-size: 1.15rem; }
    .sync-form { display: grid; gap: 10px; margin-top: 15px; }
    .sync-form a { color: var(--blue); }
    .sync-token {
      width: 100%; padding: 9px 10px; border: 0; border-radius: 7px;
      background: var(--control-fill); color: var(--ink); font: inherit;
    }
    .sync-token:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .sync-remember, .sync-status { font-size: .87rem; }
    .sync-scope { color: var(--muted); font-size: .84rem; line-height: 1.6; }
    .sync-status { margin-top: 12px; line-height: 1.55; }
    .sync-status:empty { display: none; }
    .sync-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    @media (max-width: 720px), (orientation: portrait) and (max-width: 1100px) {
      body { background: var(--paper); }
      .shell { max-width: 760px; padding: 15px clamp(13px, 4vw, 34px) 32px; }
      .masthead { align-items: flex-start; flex-direction: column; gap: 10px; }
      h1 { font-size: clamp(1.32rem, 5.4vw, 1.75rem); }
      .toolbar .action { padding: 8px 9px; font-size: .82rem; white-space: nowrap; }
      .surface { padding: 0; margin-top: 16px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <h1>生词看板</h1>
      <div class="toolbar">
        <button type="button" class="action theme-toggle" id="dark-mode" aria-pressed="false">深色模式</button>
        <button type="button" class="action" id="open-sync" aria-haspopup="dialog">GitHub 同步</button>
      </div>
    </header>
    <details class="reading-materials" open>
      <summary>阅读资料</summary>
      <nav aria-label="阅读资料">
        <ul>
          <li><a href="./">中考英语阅读标词</a></li>
          <li><a href="./?set=reading-01">01 生词复现</a></li>
          <li><a href="./?set=reading-02">02 生词复现</a></li>
          <li><a href="./?set=reading-03">03 生词复现</a></li>
          <li><a href="./vocab.html" aria-current="page">生词看板</a></li>
        </ul>
      </nav>
    </details>
    <p class="feedback" id="board-status" role="status"></p>
    <main class="surface">
      <p class="demo-banner" id="demo-banner" hidden>测试数据。这不是你的生词，只用于查看看板样式。<a href="vocab.html">返回我的生词</a></p>
      <section aria-labelledby="current-title">
        <div class="count-line">
          <h2 id="current-title">当前生词</h2>
          <p class="count" id="word-count">0</p>
        </div>
        <p class="empty" id="empty-note">
          <span id="empty-text">这里还没有生词。请使用本站已有的 GitHub 同步，或在此浏览器中打开已保存的本地进度。</span>
          <a class="demo-entry" id="demo-entry" href="vocab.html?demo=1">查看示例</a>
        </p>
        <ul class="word-list" id="word-list" hidden></ul>
      </section>
      <section class="daily" id="daily" aria-labelledby="daily-title" hidden>
        <h2 id="daily-title">按日新增</h2>
        <div id="day-list"></div>
      </section>
    </main>
    <dialog class="sync-dialog" id="sync-dialog" aria-labelledby="sync-heading">
      <div class="sync-head">
        <h2 id="sync-heading">GitHub 同步</h2>
        <button type="button" class="action" id="close-sync">关闭</button>
      </div>
      <form class="sync-form" id="sync-form">
        <a href="https://github.com/settings/personal-access-tokens/new?name=Zhongkao+Reading+Lab&amp;target_name=Frank-Humingtao&amp;contents=write" target="_blank" rel="noopener noreferrer">创建同步令牌</a>
        <p class="sync-scope">只选 zhongkao-reading-progress，并给 Contents 读写权限。看板使用阅读页已经保存的令牌。</p>
        <input class="sync-token" id="sync-token" type="password" aria-label="GitHub 同步令牌" placeholder="粘贴 github_pat_ 令牌" autocomplete="off" spellcheck="false" required>
        <label class="sync-remember"><input id="remember-sync" type="checkbox"> 在此设备上记住令牌</label>
        <button type="submit" class="action primary">连接并同步</button>
      </form>
      <div class="sync-actions" id="sync-actions" hidden>
        <button type="button" class="action primary" id="sync-now">立即同步</button>
        <button type="button" class="action" id="disconnect-sync">断开</button>
      </div>
      <p class="sync-status" id="sync-status" role="status"></p>
    </dialog>
  </div>
  <script>
    document.getElementById("dark-mode").addEventListener("click", () => {
      preferredTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      updateTheme();
      try {
        localStorage.setItem(themeStorageKey, preferredTheme);
      } catch {
        // Keep the selected theme for the current page.
      }
    });
  </script>
  <script type="module" src="vocab-board.js"></script>
</body>
</html>
